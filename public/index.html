<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>route plan</title>
<style>
  :root {
    --ink: #1d1d1f;
    --line: #2b2b2b;
    --muted: #6b6b6b;
    --bg: #eef0f3;
    --paper: #ffffff;
    --accent: #1f5fbf;
    --ok: #1e8a4c;
    --danger: #c0392b;
    --warn-bg: #fff4e5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  .hidden { display: none !important; }

  /* admin-only / team-only pieces */
  body.role-basic .admin-only { display: none !important; }
  body.role-admin .basic-only { display: none !important; }

  /* ---------- OVERLAYS (name gate, event card, answers) ---------- */

  #gate, .modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 24, 31, .75);
    z-index: 50;
    padding: 16px;
  }

  .gate-card {
    background: var(--paper);
    border-radius: 12px;
    padding: 28px 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
  }

  .gate-card h1 { margin: 0 0 6px; font-size: 22px; }
  .gate-card p { margin: 0 0 18px; color: var(--muted); }

  .gate-card input[type=text],
  .gate-card input[type=password] {
    width: 100%;
    font-size: 17px;
    padding: 10px 12px;
    border: 1px solid #bbb;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  .gate-card .check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 14px;
    font-size: 15px;
    cursor: pointer;
  }

  .gate-card .check input { width: 18px; height: 18px; }

  .gate-error { color: var(--danger); font-size: 14px; margin: -6px 0 12px; }

  /* ---------- TOOLBAR ---------- */

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #d5d8dd;
  }

  .toolbar .user { font-weight: 600; margin-right: auto; display: flex; align-items: center; gap: 6px; }

  .role-badge {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 2px 8px;
    border-radius: 99px;
    background: #e8eefb;
    color: var(--accent);
  }

  body.role-admin .role-badge { background: #fdeee7; color: #b3471c; }

  button, .btn {
    font: inherit;
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #c4c8ce;
    background: #fff;
    cursor: pointer;
    color: var(--ink);
  }

  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button.link { border: 0; background: none; color: var(--accent); padding: 0 4px; }
  button.small { font-size: 13px; padding: 5px 10px; }
  button:disabled { opacity: .5; cursor: default; }

  #status { font-size: 14px; color: var(--muted); min-width: 120px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--danger); }

  /* ---------- SHEET LIST ---------- */

  .panel {
    max-width: 820px;
    margin: 12px auto 0;
    padding: 0 16px;
  }

  .panel > details {
    background: #fff;
    border: 1px solid #d5d8dd;
    border-radius: 8px;
    padding: 8px 12px;
  }

  .panel summary { cursor: pointer; font-weight: 600; }

  #saved-list { list-style: none; padding: 0; margin: 8px 0 0; }

  #saved-list li {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 0;
    border-top: 1px solid #eee;
    font-size: 14px;
  }

  #saved-list li span.info { flex: 1; min-width: 0; }
  #saved-list li small { color: var(--muted); }
  #saved-list li.current { background: #f4f8ff; }

  .pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 99px;
    background: #eef0f3;
    color: var(--muted);
    white-space: nowrap;
  }

  .pill.closed { background: #fdecea; color: var(--danger); }
  .pill.done { background: #e7f5ec; color: var(--ok); }

  /* ---------- PAPER ---------- */

  .paper {
    background: var(--paper);
    max-width: 820px;
    margin: 12px auto 24px;
    padding: 22px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
  }

  .closed-banner {
    background: #fdecea;
    color: var(--danger);
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 16px;
  }

  .sheet { border: 2px solid var(--line); }

  .head {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 24px;
    padding: 12px 14px;
    border-bottom: 2px solid var(--line);
  }

  .field label, .label {
    display: block;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 4px;
  }

  .ro-value { font-size: 18px; padding: 6px 0; border-bottom: 2px solid var(--line); min-height: 36px; }

  .date-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .date-row .sep { font-weight: 700; font-size: 18px; }

  select, input[type=text] {
    font: inherit;
    font-size: 16px;
    padding: 6px 8px;
    border: 0;
    border-bottom: 2px solid var(--line);
    background: transparent;
    border-radius: 0;
    min-width: 0;
    color: var(--ink);
  }

  select:focus, input[type=text]:focus {
    outline: none;
    border-bottom-color: var(--accent);
    background: #f4f8ff;
  }

  select:disabled, input:disabled { color: var(--ink); opacity: 1; }

  .wide { width: 100%; }

  /* ---------- ROUTE BAR ---------- */

  .route-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 10px 14px;
    border-bottom: 2px solid var(--line);
    border-left: 10px solid var(--route, transparent);
  }

  .route-bar label, .route-bar .label { font-weight: 700; font-size: 17px; margin: 0; }

  #route { font-weight: 700; min-width: 190px; }

  #route-name { font-weight: 700; font-size: 17px; }

  .route-bar small { color: var(--muted); margin-left: auto; }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--c, #999);
    flex: 0 0 auto;
    display: inline-block;
    vertical-align: middle;
  }

  /* ---------- DELIVERIES ---------- */

  table.deliveries {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  table.deliveries th,
  table.deliveries td {
    border: 2px solid var(--line);
    padding: 4px 6px;
  }

  table.deliveries tr > :first-child { border-left: 0; }
  table.deliveries tr > :last-child { border-right: 0; }
  table.deliveries tr:last-child td { border-bottom: 0; }
  table.deliveries thead th { border-top: 0; }

  table.deliveries th { font-size: 20px; font-weight: 700; }

  table.deliveries td { height: 60px; vertical-align: middle; }

  col.c-card { width: 40%; }
  col.c-pp { width: 30%; }

  .pick { width: 100%; font-weight: 700; }

  .manual {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-top: 4px;
  }

  .manual select { flex: 0 0 auto; font-weight: 700; }
  .manual input { flex: 1; width: 100%; }

  .ro-ref { font-weight: 700; font-size: 15px; }

  .refs-line { display: block; font-size: 13px; font-weight: 700; margin-top: 3px; }
  .refs-line:empty { display: none; }

  .print-ref { display: none; font-weight: 700; }

  .dur { width: 100%; font-weight: 700; }
  .dur.set { background: #eef8f1; }

  .dur-by { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; min-height: 14px; }
  .dur-by.saved { color: var(--ok); }

  .m-label { display: none; }

  /* shortcut card in the first column */
  .card-link {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 13px;
    line-height: 1.25;
    padding: 4px 8px;
    border: 1px solid #d5d8dd;
    border-left: 6px solid var(--c, #999);
    border-radius: 6px;
    background: #fafbfc;
  }

  .card-link:hover { background: #f1f5fb; }
  .card-link.lunch { border-left-color: #8a8f98; background: #f4f5f7; cursor: default; }

  .card-link .cl-time { font-weight: 700; }
  .card-link .cl-title,
  .card-link .cl-loc {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-link .cl-loc { color: var(--muted); }

  .no-event { font-size: 13px; color: var(--muted); font-style: italic; }

  /* driving time (admin) */
  .travel { display: block; font-size: 12px; color: #5a4a00; background: #fff6d6; border-radius: 5px; padding: 1px 6px; margin: 0 0 3px; }
  .travel.back { margin: 3px 0 0; }
  .travel.missing { color: var(--muted); background: #f1f2f4; }

  a.btn { text-decoration: none; display: inline-block; }
  #route-drive { font-weight: 700; color: var(--ink); }

  /* team view: route preview only */
  body.role-basic table.deliveries,
  body.role-basic .sign { display: none; }

  /* planned vs real duration (admin) */
  .dur-plan { display: block; font-size: 12px; color: var(--muted); }
  .flag { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: var(--danger); border-radius: 5px; padding: 1px 6px; margin-top: 2px; }
  tr.flagged td.c-times { background: #fdecea; }

  /* ---------- ROUTE PREVIEW ---------- */

  .preview { border-bottom: 2px solid var(--line); }

  .preview > summary {
    cursor: pointer;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 17px;
  }

  .preview > summary small { font-weight: 400; color: var(--muted); font-size: 14px; }

  .pv-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px;
    padding: 0 14px 14px;
  }

  .pv-list { list-style: none; margin: 0; padding: 0; }

  .pv-item {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 8px;
    padding: 6px 0;
    border-top: 1px solid #eee;
  }

  .pv-item:first-child { border-top: 0; }

  .pv-num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--c, #555);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pv-num.wh { background: #2b2b2b; }

  .pv-drive { font-size: 12px; color: #5a4a00; }
  .pv-drive.missing { color: var(--muted); }

  .pv-card {
    display: block;
    width: 100%;
    text-align: left;
    padding: 4px 8px;
    font-size: 14px;
    line-height: 1.3;
    border: 1px solid #e0e3e7;
    border-left: 5px solid var(--c, #999);
    border-radius: 6px;
    background: #fafbfc;
  }

  .pv-card small { display: block; color: var(--muted); font-size: 12px; }
  .pv-card .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pv-wh { font-size: 14px; }
  .pv-wh small { color: var(--muted); }

  #pv-map {
    min-height: 320px;
    height: 100%;
    border-radius: 8px;
    background: #eef0f3;
    position: relative;
    z-index: 0;
  }

  .pv-map-msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 16px;
  }

  .pv-pin {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .4);
    color: #fff;
    font: 700 12px/20px Calibri, Arial, sans-serif;
    text-align: center;
  }

  .pv-empty { color: var(--muted); font-size: 14px; padding: 0 14px 14px; }

  .sign {
    padding: 22px 14px 6px;
    display: grid;
    gap: 16px;
    max-width: 420px;
    margin: 0 auto;
  }

  .sign input { width: 100%; }

  /* ---------- CARD / ANSWERS (modal boxes) ---------- */

  .card-box, .answers-box {
    background: var(--paper);
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow: auto;
    border-radius: 12px;
    border-top: 10px solid var(--c, #999);
    padding: 16px 20px 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
  }

  .answers-box { max-width: 720px; border-top-color: var(--accent); }

  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-top .chip { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin-right: auto; }

  .cm-ref { font-size: 22px; font-weight: 700; margin: 8px 0 2px; }
  .cm-when { color: var(--muted); font-size: 15px; }
  .card-box h2 { font-size: 19px; margin: 12px 0; }

  .cm-block { border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
  .cm-block .label { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .cm-desc { white-space: pre-wrap; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
  .card-box a { color: var(--accent); }

  .answers-box h2 { font-size: 20px; margin: 0 auto 0 0; }
  .answers-sub { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }

  .ans-item { border-top: 1px solid #eee; padding: 10px 0; }
  .ans-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .ans-head strong { flex: 1; min-width: 200px; }
  .ans-final { font-weight: 700; white-space: nowrap; }
  .ans-final.none { color: var(--danger); font-weight: 400; }
  .ans-hist { list-style: none; margin: 6px 0 0; padding: 0 0 0 12px; border-left: 3px solid #e3e5e9; font-size: 13px; color: var(--muted); }
  .ans-hist li { padding: 1px 0; }

  /* ---------- MOBILE: one block per delivery ---------- */

  @media (max-width: 640px) {

    .toolbar { padding: 8px 10px; gap: 6px; }
    .toolbar .user { flex: 1 0 100%; }
    .toolbar #status { order: 5; flex: 1 0 100%; min-width: 0; }
    .toolbar > button { flex: 1; padding: 8px 6px; }

    .panel { padding: 0 8px; }

    .paper { padding: 0; margin: 8px 8px 24px; }
    .closed-banner { margin: 8px; }

    .sheet { border-width: 0; }

    .head { grid-template-columns: 1fr; gap: 10px; padding: 12px; }
    .date-row { flex-wrap: nowrap; }
    .date-row select { flex: 1; }
    .date-row #date-month { flex: 2; }

    select, input[type=text] { font-size: 16px; }   /* 16px avoids iOS zoom */

    .route-bar { padding: 10px 12px; }
    #route { flex: 1; min-width: 0; }
    .route-bar small { margin-left: 0; flex: 1 0 100%; }

    table.deliveries, table.deliveries tbody { display: block; }
    table.deliveries thead, table.deliveries colgroup { display: none; }

    table.deliveries tbody { counter-reset: row; }

    table.deliveries tr {
      counter-increment: row;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 8px 10px;
      padding: 12px;
      border-bottom: 1px solid #d5d8dd;
    }

    table.deliveries tr::before {
      content: counter(row);
      grid-row: 1;
      align-self: start;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #eef0f3;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    table.deliveries td {
      display: block;
      border: 0 !important;
      height: auto;
      padding: 0;
      grid-column: 2;
      min-width: 0;
    }

    td.c-pp { order: 1; }
    td.c-card { order: 2; }
    td.c-times { order: 3; }

    td.c-card:empty { display: none; }

    .m-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }

    .dur { font-size: 17px; padding: 8px; border: 1px solid #c4c8ce; border-radius: 8px; }

    .card-link { font-size: 14px; padding: 6px 10px; }

    /* admin: only filled rows + the next empty one */
    body.role-admin table.deliveries tr.empty:not(.next) { display: none; }

    .sign { padding: 16px 12px; }

    .pv-grid { grid-template-columns: minmax(0, 1fr); padding: 0 12px 12px; }
    #pv-map { order: -1; min-height: 240px; height: 240px; }

    .modal { align-items: flex-end; padding: 0; }
    .card-box, .answers-box { max-width: none; border-radius: 14px 14px 0 0; max-height: 88vh; }
  }

  /* ---------- PRINT (A4, like the paper form) ---------- */

  @media print {
    @page { size: A4; margin: 12mm; }

    body { background: #fff; }

    .toolbar, .panel, #gate, .modal, .route-bar small, .route-bar button, .route-bar a, .travel, .closed-banner, .flag, .dur-plan { display: none !important; }
    body.role-admin .preview { display: none !important; }
    .preview > summary { list-style: none; }
    #pv-map { display: none; }
    .pv-grid { grid-template-columns: 1fr; }

    .paper { box-shadow: none; margin: 0; padding: 0; max-width: none; }

    select {
      -webkit-appearance: none;
      appearance: none;
      background: none;
    }

    select, input[type=text] { border-bottom-color: transparent; }

    .head select, .sign input { border-bottom-color: var(--line); }

    .pick, .manual, .refs-line, .dur-by { display: none !important; }
    .print-ref { display: inline; }
    .dur.set { background: none; }

    .card-link { border: 0; background: none; padding: 0; }
    .no-event { display: none; }

    table.deliveries td { height: 64px; }
  }
</style>
</head>
<body class="role-basic">

<!-- ================= NAME GATE ================= -->
<form id="gate">
  <div class="gate-card">
    <h1>route plan</h1>
    <p>Please enter your name to continue.</p>
    <input id="gate-name" type="text" autocomplete="name" placeholder="Your name" maxlength="60" required>
    <label class="check"><input type="checkbox" id="gate-admin"> I'm the admin</label>
    <input id="gate-pass" type="password" class="hidden" placeholder="Admin password" autocomplete="current-password">
    <div class="gate-error hidden" id="gate-error"></div>
    <button class="primary wide" type="submit" id="gate-enter">Enter</button>
  </div>
</form>

<!-- ================= EVENT CARD ================= -->
<div id="card-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cm-title">
  <div class="card-box" id="cm-box">
    <div class="card-top">
      <span class="chip"><span class="dot"></span><span id="cm-color"></span></span>
      <button type="button" class="small" data-close aria-label="Close">Close</button>
    </div>
    <div class="cm-ref" id="cm-ref"></div>
    <div class="cm-when" id="cm-when"></div>
    <h2 id="cm-title"></h2>
    <div class="cm-block" id="cm-loc-block">
      <span class="label">Address</span>
      <div id="cm-loc"></div>
      <a id="cm-map" target="_blank" rel="noopener">Open in Google Maps</a>
    </div>
    <div class="cm-block" id="cm-desc-block">
      <span class="label">Event details</span>
      <div class="cm-desc" id="cm-desc"></div>
    </div>
  </div>
</div>

<!-- ================= ANSWERS (admin) ================= -->
<div id="answers-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="ans-title">
  <div class="answers-box">
    <div class="card-top">
      <h2 id="ans-title">Delivery duration answers</h2>
      <button type="button" class="small" id="ans-csv">Download CSV</button>
      <button type="button" class="small" data-close aria-label="Close">Close</button>
    </div>
    <div class="answers-sub" id="ans-sub"></div>
    <div id="ans-body"></div>
  </div>
</div>

<!-- ================= TOOLBAR ================= -->
<div class="toolbar">
  <div class="user">
    <span id="who"></span>
    <span class="role-badge" id="role-badge">Team</span>
    <button class="link" id="change-user" type="button">change</button>
  </div>
  <span id="status"></span>
  <button type="button" class="admin-only" id="btn-new">New</button>
  <button type="button" class="admin-only primary" id="btn-save">Save</button>
  <button type="button" class="admin-only" id="btn-answers">Answers</button>
  <button type="button" class="admin-only" id="btn-close">Close day</button>
  <button type="button" class="basic-only" id="btn-reload">Refresh</button>
  <button type="button" id="btn-print">Print</button>
</div>

<!-- ================= SHEETS ================= -->
<div class="panel" id="saved">
  <details id="saved-box">
    <summary>Sheets (<span id="saved-count">0</span>)</summary>
    <ul id="saved-list"></ul>
  </details>
</div>

<!-- ================= SHEET ================= -->
<main class="paper">

  <div class="closed-banner hidden" id="closed-banner"></div>

  <div class="empty-state hidden" id="empty-state">Open a sheet from the list above.</div>

  <div id="sheet-wrap">
  <div class="sheet">

    <div class="head">

      <div class="field">
        <span class="label">Date:</span>
        <div class="date-row admin-only">
          <select id="date-day" aria-label="Day of month"></select>
          <span class="sep">/</span>
          <select id="date-month" aria-label="Month"></select>
          <span class="sep">/</span>
          <select id="date-year" aria-label="Year"></select>
        </div>
        <div class="ro-value basic-only" id="ro-date"></div>
      </div>

      <div class="field">
        <label for="weekday">Day:</label>
        <select id="weekday" class="wide admin-only"></select>
        <div class="ro-value basic-only" id="ro-day"></div>
      </div>

    </div>

    <div class="route-bar" id="route-bar">
      <span class="label">Route:</span>
      <select id="route" class="admin-only" aria-label="Route"><option value="">Choose the date first</option></select>
      <span id="route-name" class="basic-only"></span>
      <button type="button" class="small admin-only" id="route-fill" title="Put every event of this route on the sheet">Fill all</button>
      <button type="button" class="small admin-only" id="route-refresh" title="Reload the calendar">Refresh</button>
      <a class="btn small hidden" id="route-map" target="_blank" rel="noopener">Open route in Maps</a>
      <small id="route-drive" class="admin-only"></small>
      <small id="cal-synced" class="admin-only"></small>
    </div>

    <details class="preview" id="preview" open>
      <summary>Route preview <small id="pv-sum"></small></summary>
      <div class="pv-grid" id="pv-grid">
        <ol class="pv-list" id="pv-list"></ol>
        <div id="pv-map"><div class="pv-map-msg" id="pv-map-msg">Loading map…</div></div>
      </div>
      <div class="pv-empty hidden" id="pv-empty"></div>
    </details>

    <table class="deliveries">
      <colgroup>
        <col class="c-card"><col class="c-pp"><col>
      </colgroup>
      <thead>
        <tr>
          <th>Delivery</th>
          <th>PP / OS</th>
          <th>Delivery duration</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

  </div>

  <div class="sign">
    <div class="field">
      <label for="sign-out">Sign out:</label>
      <input id="sign-out" type="text">
    </div>
    <div class="field">
      <label for="sign-in">Sign In:</label>
      <input id="sign-in" type="text">
    </div>
  </div>
  </div>

</main>

<script>
(() => {

  // =========================================
  // CONSTANTS
  // =========================================

  const ROWS = 9;

  const MONTHS = [
    'January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'
  ];

  const WEEKDAYS = [
    'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'
  ];

  const YEARS = [2026, 2027];

  // 30 minutes -> 6 hours, every 15 minutes
  const DURATIONS = [];

  for (let m = 30; m <= 360; m += 15) {
    DURATIONS.push(m);
  }

  // Google Calendar event colours (colour id -> name, hex)
  const EVENT_COLORS = {
    '1': ['Lavender', '#7986cb'],
    '2': ['Sage', '#33b679'],
    '3': ['Grape', '#8e24aa'],
    '4': ['Flamingo', '#e67c73'],
    '5': ['Yellow', '#f6bf26'],
    '6': ['Orange', '#f4511e'],
    '7': ['Blue', '#039be5'],
    '8': ['Grey', '#616161'],
    '9': ['Dark blue', '#3f51b5'],
    '10': ['Green', '#0b8043'],
    '11': ['Red', '#d50000']
  };

  // Routes listed first, in this order (any other colour comes after)
  const ROUTE_ORDER = ['Orange', 'Blue'];

  const MANUAL = '__manual';

  // Driving time margin: Google Maps time + 15 min, rounded UP to the next 15 min
  // (addresses are only the area from the title, so Maps times are approximate)
  const DRIVE_MARGIN = 15;
  const DRIVE_ROUND = 15;

  // Every route leaves the warehouse at this time (calendar times are not used)
  const DEPART_TIME = '09:30';

  // Lunch: option in the PP / OS dropdown, adds this many minutes to the route
  const LUNCH_KEY = 'LUNCH';
  const LUNCH_MIN = 30;

  const NAME_KEY = 'route-plan:name';
  const TOKEN_KEY = 'route-plan:admin-token';

  const $ = id => document.getElementById(id);

  const field = (i, f) => document.querySelector(`[data-row="${i}"][data-field="${f}"]`);


  // =========================================
  // HELPERS
  // =========================================

  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function durationLabel(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    const parts = [];
    if (h) parts.push(h + (h === 1 ? ' hour' : ' hours'));
    if (m) parts.push(m + ' minutes');
    return parts.join(' ');
  }

  function shortTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const today = new Date().toDateString() === d.toDateString();
    return today
      ? d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
  }

  function fillSelect(select, options, placeholder) {
    select.innerHTML = '';
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = placeholder;
    select.appendChild(empty);
    for (const [value, label] of options) {
      const opt = document.createElement('option');
      opt.value = String(value);
      opt.textContent = label;
      select.appendChild(opt);
    }
  }

  function safeGet(key) {
    try { return localStorage.getItem(key) || ''; } catch { return ''; }
  }

  function safeSet(key, value) {
    try {
      if (value) localStorage.setItem(key, value);
      else localStorage.removeItem(key);
    } catch {}
  }

  function newId() {
    return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  }

  function setStatus(text, kind = '') {
    const el = $('status');
    el.textContent = text;
    el.className = kind;
  }

  function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function safeHex(hex) {
    return /^#[0-9a-f]{6}$/i.test(hex || '') ? hex : '#9e9e9e';
  }

  // Name for a colour that is not one of Google's event colours
  function hueName(hex) {
    const n = parseInt(safeHex(hex).slice(1), 16);
    const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if (d < 0.12) return 'Grey';
    let h;
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
    if (h < 12 || h >= 340) return 'Red';
    if (h < 45) return 'Orange';
    if (h < 70) return 'Yellow';
    if (h < 170) return 'Green';
    if (h < 260) return 'Blue';
    return 'Purple';
  }

  // Google Calendar descriptions may contain simple HTML -> plain text
  function descriptionText(html) {
    if (!html) return '';
    const withBreaks = String(html)
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(p|div|li)>/gi, '\n');
    const doc = new DOMParser().parseFromString(withBreaks, 'text/html');
    return (doc.body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  }

  function linkify(escaped) {
    return escaped.replace(/https?:\/\/[^\s<]+/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  }

  function timeLabel(ev) {
    return ev.allDay ? 'All day' : `${ev.start}–${ev.end}`;
  }

  // Text for the dropdown: "10:00 · D04 pp26159 os49481 (4876) BALDue"
  function optionLabel(ev) {
    const time = ev.allDay ? 'All day' : ev.start;
    const t = (ev.title || '').replace(/\s+/g, ' ').trim();
    return `${time} · ${t.length > 44 ? t.slice(0, 43) + '…' : t}`;
  }

  // Every PP / OS in the title + description: "pp26347 pp26352 os49917"
  function parseRefs(text) {
    const refs = [];
    const re = /\b(PP|OS)\s*[-:#.]?\s*(\d{3,})/gi;
    let m;
    while ((m = re.exec(text || ''))) {
      const ref = { kind: m[1].toUpperCase(), number: m[2] };
      if (!refs.some(r => r.kind === ref.kind && r.number === ref.number)) refs.push(ref);
    }
    return refs;
  }

  // "PP 26347, 26352 · OS 49917, 49976"
  function refsText(refs) {
    return ['PP', 'OS']
      .map(k => {
        const nums = (refs || []).filter(r => r.kind === k).map(r => r.number);
        return nums.length ? `${k} ${nums.join(', ')}` : '';
      })
      .filter(Boolean)
      .join(' · ');
  }

  // Add refs (all PP / OS) and main kind / number to a calendar event
  function prepareEvent(ev) {
    const refs = parseRefs((ev.title || '') + '\n' + descriptionText(ev.description));
    const first = refs[0];
    return {
      ...ev,
      refs,
      kind: first ? first.kind : (ev.kind || ''),
      number: first ? first.number : (ev.number || '')
    };
  }

  // Unique key of an event: its PP / OS, or time + title when it has none
  function evKey(ev) {
    return ev.number ? ev.kind + ':' + ev.number : 'T:' + (ev.start || '') + '|' + (ev.title || '');
  }

  function minutesText(m) {
    if (m === null || m === undefined) return '?';
    const h = Math.floor(m / 60), r = m % 60;
    return h ? `${h} h${r ? ' ' + r + ' min' : ''}` : `${r} min`;
  }

  function toMin(t) {
    const [h, m] = String(t || '').split(':').map(Number);
    return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null;
  }

  function clock(min) {
    if (min === null || min === undefined) return '';
    const m = ((min % 1440) + 1440) % 1440;
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }

  // Planned minutes of a delivery = length of its calendar event
  function plannedOf(ev) {
    if (!ev || ev.allDay) return null;
    const a = toMin(ev.start), b = toMin(ev.end);
    return a !== null && b !== null && b > a ? b - a : null;
  }

  // Google encoded polyline -> [[lat, lng], ...]
  function decodePolyline(str) {
    const out = [];
    let i = 0, lat = 0, lng = 0;
    while (i < (str || '').length) {
      for (const which of [0, 1]) {
        let shift = 0, result = 0, b;
        do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        const d = (result & 1) ? ~(result >> 1) : (result >> 1);
        if (which === 0) lat += d; else lng += d;
      }
      out.push([lat / 1e5, lng / 1e5]);
    }
    return out;
  }

  // 18 min -> 18 + 15 = 33 -> 45 min
  function withMargin(minutes) {
    if (minutes === null || minutes === undefined) return null;
    return Math.ceil((minutes + DRIVE_MARGIN) / DRIVE_ROUND) * DRIVE_ROUND;
  }

  // Driving legs + warehouse as Google Maps gave them:
  // live calendar (admin) or the copy saved with the sheet
  function rawLegsSource() {
    const saved = sheetPlan || {};
    if (isAdmin) {
      return {
        legs: { ...(saved.legs || {}), ...dayLegs },
        wh: warehouse || saved.warehouse || '',
        whc: whCoords || saved.warehouseCoords || ''
      };
    }
    return { legs: saved.legs || {}, wh: saved.warehouse || '', whc: saved.warehouseCoords || '' };
  }

  // Same legs with the margin applied (used for every time shown / added up)
  function legsSource() {
    const { legs, wh, whc } = rawLegsSource();
    const out = {};
    for (const [k, l] of Object.entries(legs)) {
      out[k] = l && l.minutes !== null && l.minutes !== undefined
        ? { ...l, minutes: withMargin(l.minutes), maps: l.minutes }
        : l;
    }
    return { legs: out, wh, whc };
  }

  // tooltip: where the number comes from
  function marginTitle(leg) {
    return leg && leg.maps !== undefined
      ? ` title="Google Maps ${leg.maps} min + ${DRIVE_MARGIN} min margin, rounded up to ${DRIVE_ROUND} min"`
      : '';
  }

  // Place for Google Maps. Same rule as lugar_() in the Apps Script (keep them equal,
  // the driving times are stored under these exact texts):
  //   1. Location field  2. full Eircode in title / description
  //   3. area at the start of the title: "D04 pp26159 ..." -> "Dublin 4, Ireland",
  //                                      "Bray pp185 ..."  -> "Bray, Ireland"
  function placeFromEvent(ev) {

    if (!ev) return '';

    const loc = String(ev.location || '').trim();
    if (loc) return loc;

    const title = String(ev.title || '');
    const desc = String(ev.description || '').replace(/<[^>]+>/g, ' ');

    const eircode = (title + ' ' + desc).match(/\b([AC-FHKNPRTV-Y]\d{2}|D6W)\s?[0-9AC-FHKNPRTV-Y]{4}\b/i);
    if (eircode) return eircode[0].toUpperCase() + ', Ireland';

    const area = title
      .split(/\b(?:PP|OS)\s*[-:#.]?\s*\d/i)[0]
      .replace(/[\s,\-–:]+$/, '')
      .trim();

    if (!area || /^\d+\s*vans?$/i.test(area)) return '';

    const dublin = area.match(/^D\s?0?(\d{1,2})(W)?$/i);
    if (dublin) return 'Dublin ' + Number(dublin[1]) + (dublin[2] ? 'W' : '') + ', Ireland';

    return area + ', Ireland';

  }

  function mapsPlace(ev) {
    if (!ev || ev.lunch) return '';
    return ev.place || placeFromEvent(ev) || '';
  }

  // What Google Maps gets: the exact point found by the Apps Script ("lat,lng"),
  // otherwise the place text ("Dublin 16, Ireland" is not always found by Maps)
  function mapsTarget(ev) {
    if (!ev || ev.lunch) return '';
    return ev.coords || mapsPlace(ev);
  }

  function lunchEvent() {
    return { lunch: true, title: 'Lunch', minutes: LUNCH_MIN };
  }

  // Text of a sheet row: PP / OS list, or the event title
  function rowRefText(row) {
    if (row.event && row.event.lunch) return 'Lunch';
    if (row.event && row.event.refs && row.event.refs.length) return refsText(row.event.refs);
    if (row.number) return `${row.kind} ${row.number}`;
    return row.event ? '—' : '';
  }


  // =========================================
  // STATE
  // =========================================

  let userName = safeGet(NAME_KEY);
  let adminToken = safeGet(TOKEN_KEY);
  let isAdmin = false;

  let currentId = newId();
  let sheetSaved = false;          // current sheet exists on the server
  let sheetStatus = 'open';        // open | closed
  let sheetInfo = {};              // closedBy / closedAt / updatedAt
  let savedKeys = new Set();       // delivery keys as last saved (durations need them)

  let calDate = '';
  let calColor = '';               // default colour of the calendar
  let syncedAt = null;
  let dayEvents = [];              // events of the sheet date (already filtered)
  let routes = [];                 // [{ name, hex, events: [...] }]
  let dayLegs = {};                // driving times of the day: { "from→to": { minutes, km } }
  let warehouse = '';              // van start / end (from the Apps Script)
  let whCoords = '';               // warehouse "lat,lng" (from the Apps Script)
  let travel = [];                 // per row: { from, leg, back } (admin)
  let sheetPlan = null;            // route saved with the sheet (legs + warehouse)
  let currentRoute = '';           // route name (colour)
  let routeHex = '';

  let rowEvents = new Array(ROWS).fill(null);    // event linked to each row
  let manualMode = new Array(ROWS).fill(false);  // row typed by hand
  let rowDur = new Array(ROWS).fill(null);       // { duration, durationBy, durationAt }
  let justSaved = new Array(ROWS).fill(false);

  let sheetList = [];


  // Events that never show: "1 van", "2 vans", no title, two-letter initials
  function isIgnored(ev) {
    const t = (ev.title || '').trim();
    if (!t || /^\(no title\)$/i.test(t)) return true;
    if (/^\d+\s*vans?$/i.test(t)) return true;
    if (/^\p{L}\.?\s*\p{L}\.?$/u.test(t)) return true;
    return false;
  }


  function colorOf(ev) {
    if (EVENT_COLORS[ev.colorId]) {
      const [name, hex] = EVENT_COLORS[ev.colorId];
      return { name, hex };
    }
    const hex = safeHex(calColor);
    return { name: hueName(hex), hex };
  }


  function sheetIsoDate() {

    const d = $('date-day').value;
    const m = $('date-month').value;
    const y = $('date-year').value;

    if (!d || !m || !y) return '';

    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

  }


  function todayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }


  function listIso(s) {
    const d = s.date || {};
    return d.year ? `${d.year}-${String(d.month).padStart(2, '0')}-${String(d.day).padStart(2, '0')}` : '';
  }


  function rowKey(i) {
    if (rowEvents[i] && rowEvents[i].lunch) return LUNCH_KEY;
    const num = field(i, 'number').value.trim();
    if (num) return field(i, 'kind').value + ':' + num;
    const ev = rowEvents[i];
    return (ev && !ev.number) ? evKey(ev) : '';
  }


  function snapshot(ev) {
    const c = colorOf(ev);
    return {
      date: ev.date, start: ev.start, end: ev.end, allDay: !!ev.allDay,
      title: ev.title, location: ev.location, place: ev.place || '', coords: ev.coords || '', description: ev.description || '',
      kind: ev.kind, number: ev.number, refs: ev.refs || [], colorName: c.name, colorHex: c.hex
    };
  }


  function buildRoutes() {

    const map = new Map();

    for (const ev of dayEvents) {
      const c = colorOf(ev);
      if (!map.has(c.name)) map.set(c.name, { ...c, events: [] });
      map.get(c.name).events.push(ev);
    }

    const rank = r => {
      const i = ROUTE_ORDER.indexOf(r.name);
      return i === -1 ? ROUTE_ORDER.length : i;
    };

    routes = [...map.values()].sort((a, b) => rank(a) - rank(b) || b.events.length - a.events.length);

  }


  function findEvent(kind, number) {
    return dayEvents.find(ev => ev.number === number && ev.kind === kind);
  }


  // =========================================
  // BUILD FORM
  // =========================================

  function buildHeader() {

    fillSelect($('date-month'), MONTHS.map((name, i) => [i + 1, name]), 'Month');

    fillSelect($('date-year'), YEARS.map(y => [y, String(y)]), 'Year');

    $('date-year').value = String(YEARS[0]);

    fillSelect($('weekday'), WEEKDAYS.map(d => [d, d]), 'Select day');

    refreshDays();

  }


  // Day-of-month list follows the chosen month / year
  function refreshDays() {

    const select = $('date-day');
    const current = select.value;
    const month = Number($('date-month').value);
    const year = Number($('date-year').value) || YEARS[0];
    const max = month ? new Date(year, month, 0).getDate() : 31;

    const days = [];
    for (let d = 1; d <= max; d++) days.push([d, ordinal(d)]);

    fillSelect(select, days, 'Day');

    if (current && Number(current) <= max) select.value = current;

  }


  // Suggest the weekday from the chosen date (still editable)
  function suggestWeekday() {

    const d = Number($('date-day').value);
    const m = Number($('date-month').value);
    const y = Number($('date-year').value);

    if (!d || !m || !y) return;

    const js = new Date(y, m - 1, d).getDay();
    $('weekday').value = WEEKDAYS[(js + 6) % 7];

  }


  function buildRows() {

    const tbody = $('rows');
    const durationOptions = DURATIONS.map(m => [m, durationLabel(m)]);

    tbody.innerHTML = '';

    for (let i = 0; i < ROWS; i++) {

      const tr = document.createElement('tr');
      tr.id = 'row-' + i;

      tr.innerHTML = `
        <td class="c-card" id="card-${i}"></td>
        <td class="c-pp">
          <span class="m-label">PP / OS</span>
          <select class="pick admin-only" data-row="${i}" data-field="pick" aria-label="PP / OS"></select>
          <div class="manual hidden admin-only" id="manual-${i}">
            <select data-row="${i}" data-field="kind" aria-label="PP or OS">
              <option value="PP">PP</option>
              <option value="OS">OS</option>
            </select>
            <input type="text" data-row="${i}" data-field="number" inputmode="numeric" placeholder="Number" aria-label="PP / OS number">
          </div>
          <span class="refs-line admin-only" id="refs-${i}"></span>
          <span class="ro-ref basic-only" id="ro-ref-${i}"></span>
          <span class="print-ref" id="print-ref-${i}"></span>
        </td>
        <td class="c-times">
          <span class="m-label">Delivery duration</span>
          <select class="dur" data-row="${i}" data-field="duration" aria-label="Delivery duration"></select>
          <span class="dur-plan" id="dur-plan-${i}"></span>
          <span class="dur-by" id="dur-by-${i}"></span>
        </td>`;

      fillSelect(tr.querySelector('[data-field=duration]'), durationOptions, '—');

      tbody.appendChild(tr);

    }

  }


  // =========================================
  // ROLE
  // =========================================

  function applyRole() {

    document.body.classList.toggle('role-admin', isAdmin);
    document.body.classList.toggle('role-basic', !isAdmin);

    $('role-badge').textContent = isAdmin ? 'Admin' : 'Team';

    applyLock();

  }


  // what can be edited right now
  function applyLock() {

    const closed = sheetStatus === 'closed';
    const adminEdit = isAdmin && !closed;

    for (const id of ['date-day', 'date-month', 'date-year', 'weekday', 'route', 'sign-out', 'sign-in']) {
      $(id).disabled = !adminEdit;
    }

    $('route-fill').disabled = !adminEdit || !routes.some(r => r.name === currentRoute);
    $('route-refresh').disabled = !adminEdit;
    $('btn-save').disabled = closed;

    document.querySelectorAll('[data-field=pick], [data-field=kind], [data-field=number]')
      .forEach(el => { el.disabled = !adminEdit; });

    document.querySelectorAll('[data-field=duration]')
      .forEach(el => {
        const r = Number(el.dataset.row);
        el.disabled = !isAdmin || closed || !rowKey(r) || !!(rowEvents[r] && rowEvents[r].lunch);
      });

    $('btn-close').textContent = closed ? 'Reopen day' : 'Close day';
    $('btn-close').disabled = !sheetSaved;
    $('btn-answers').disabled = !sheetSaved;

    const banner = $('closed-banner');
    banner.classList.toggle('hidden', !closed);
    banner.textContent = closed
      ? `Day closed by ${sheetInfo.closedBy || '?'} · ${shortTime(sheetInfo.closedAt)} – durations can't be changed`
      : '';

    // team member without a sheet opened
    const nothing = !isAdmin && !sheetSaved;
    $('sheet-wrap').classList.toggle('hidden', nothing);
    $('empty-state').classList.toggle('hidden', !nothing);

  }


  // =========================================
  // ROUTE DROPDOWN (admin)
  // =========================================

  function renderRoute() {

    const sel = $('route');

    if (!calDate) {
      sel.innerHTML = '<option value="">Choose the date first</option>';
    } else {
      const opts = routes.map(r =>
        `<option value="${escapeHtml(r.name)}">${escapeHtml(r.name)} – ${r.events.length} event${r.events.length === 1 ? '' : 's'}</option>`);
      // keep a saved route that has no events any more
      if (currentRoute && !routes.some(r => r.name === currentRoute)) {
        opts.push(`<option value="${escapeHtml(currentRoute)}">${escapeHtml(currentRoute)}</option>`);
      }
      sel.innerHTML =
        `<option value="">${routes.length ? 'Choose route' : 'No routes on this day'}</option>` + opts.join('');
    }

    sel.value = currentRoute;

    const r = routes.find(x => x.name === currentRoute);
    if (r) routeHex = r.hex;
    $('route-bar').style.setProperty('--route', currentRoute ? safeHex(routeHex) : 'transparent');

    $('route-name').textContent = currentRoute || '—';

    $('cal-synced').textContent = !calDate ? '' : syncedAt
      ? 'Calendar synced ' + new Date(syncedAt).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' })
      : 'Calendar never synced yet';

  }


  // =========================================
  // ROWS
  // =========================================

  function renderPick(i, used) {

    const sel = field(i, 'pick');
    const key = rowKey(i);
    const route = routes.find(r => r.name === currentRoute);

    const opts = [];
    const seen = new Set();

    for (const ev of (route ? route.events : [])) {
      const k = evKey(ev);
      seen.add(k);
      const taken = used.has(k) && k !== key;
      opts.push(`<option value="${escapeHtml(k)}" ${taken ? 'disabled' : ''}>${escapeHtml(optionLabel(ev))}${taken ? ' (on sheet)' : ''}</option>`);
    }

    // current value from another route / not in calendar any more
    if (key && key !== LUNCH_KEY && !seen.has(key) && rowEvents[i]) {
      opts.unshift(`<option value="${escapeHtml(key)}">${escapeHtml(optionLabel(rowEvents[i]))}</option>`);
      seen.add(key);
    }

    const placeholder = !calDate ? 'Choose the date first'
      : !route ? 'Choose a route first'
      : 'Select PP / OS';

    seen.add(LUNCH_KEY);
    const lunchTaken = used.has(LUNCH_KEY) && key !== LUNCH_KEY;

    sel.innerHTML =
      `<option value="">${placeholder}</option>` +
      opts.join('') +
      `<option value="${LUNCH_KEY}" ${lunchTaken ? 'disabled' : ''}>🍽 Lunch (${LUNCH_MIN} min)${lunchTaken ? ' (on sheet)' : ''}</option>` +
      `<option value="${MANUAL}">Other – type number…</option>`;

    const manual = manualMode[i] || (key && !seen.has(key));
    manualMode[i] = !!manual;

    sel.value = manual ? MANUAL : key;

    $('manual-' + i).classList.toggle('hidden', !manual);

  }


  function renderRefs(i) {

    const num = field(i, 'number').value.trim();
    const linked = rowEvents[i];
    const text = rowRefText({ kind: field(i, 'kind').value, number: num, event: linked });

    $('refs-' + i).textContent = (linked && linked.refs && linked.refs.length > 1) ? refsText(linked.refs) : '';
    $('ro-ref-' + i).textContent = text;
    $('print-ref-' + i).textContent = text === '—' ? '' : text;

  }


  // Route schedule: leave the warehouse at DEPART_TIME, then for every stop
  //   drive (Maps + margin) -> arrive -> delivery time -> leave -> next drive ...
  // Delivery time = the Delivery duration chosen, or the planned time (calendar event length).
  // Lunch = LUNCH_MIN minutes, no driving.
  let schedule = null;

  function buildSchedule(stops) {

    const { legs, wh } = legsSource();

    let t = toMin(DEPART_TIME);
    let prevPlace = wh || null;
    let prevLabel = 'from warehouse';
    let uncertain = false;
    let totalDrive = 0, km = 0, missing = 0, service = 0;

    const items = stops.map((s, k) => {

      const ev = s.ev;

      if (ev.lunch) {
        const item = { ...s, lunch: true, arrive: t, leave: t + LUNCH_MIN, service: LUNCH_MIN, uncertain };
        t += LUNCH_MIN;
        return item;
      }

      const place = mapsPlace(ev);
      let leg = null, label = null;

      if (!place) {
        uncertain = true;
      } else if (prevPlace) {
        label = prevLabel;
        leg = legs[prevPlace + '→' + place] || null;
        if (leg && leg.minutes !== null) { t += leg.minutes; totalDrive += leg.minutes; km += leg.km || 0; }
        else { missing++; uncertain = true; }
      }

      const arrive = t;
      const d = s.row >= 0 ? rowDur[s.row] : null;
      const planned = plannedOf(ev);
      const mins = d && d.duration ? d.duration : planned;

      if (!mins) uncertain = true;
      t += mins || 0;
      service += mins || 0;

      const item = {
        ...s, place, leg, label, noPlace: !place,
        arrive, leave: t, service: mins, serviceFrom: d && d.duration ? 'real' : 'planned',
        planned, uncertain
      };

      if (place) { prevPlace = place; prevLabel = 'from previous'; }

      return item;

    });

    // back to the warehouse
    let backLeg = null, back = null;

    if (wh && prevPlace && prevPlace !== wh) {
      backLeg = legs[prevPlace + '→' + wh] || null;
      if (backLeg && backLeg.minutes !== null) {
        totalDrive += backLeg.minutes; km += backLeg.km || 0;
        back = t + backLeg.minutes;
      } else {
        missing++;
      }
    }

    return {
      items, wh, depart: toMin(DEPART_TIME), back, backLeg,
      end: t, totalDrive, km, missing, service, uncertain
    };

  }


  // "~10:15" when an earlier time is unknown
  function timeRange(item) {
    const pre = item.uncertain ? '~' : '';
    return `${pre}${clock(item.arrive)}–${clock(item.leave)}`;
  }


  // Schedule of the rows on the sheet + route bar summary (admin)
  function computeTravel() {

    travel = new Array(ROWS).fill(null);

    schedule = buildSchedule(previewStops());

    for (const it of schedule.items) {
      if (it.row >= 0) travel[it.row] = it;
    }

    const last = schedule.items[schedule.items.length - 1];
    if (last && last.row >= 0 && schedule.wh) travel[last.row] = { ...last, back: schedule.backLeg || 'missing' };

    $('route-drive').textContent = schedule.items.length
      ? `Leave ${DEPART_TIME} → back ${schedule.back !== null ? (schedule.uncertain ? '~' : '') + clock(schedule.back) : '?'}` +
        ` · driving ${minutesText(schedule.totalDrive)} · ${Math.round(schedule.km)} km` +
        (schedule.missing ? ` · ${schedule.missing} not calculated` : '')
      : '';

  }


  function travelHtml(i) {

    const t = isAdmin && travel[i];
    if (!t || t.lunch) return { before: '', after: '' };

    let before = '';

    if (t.noPlace) {
      before = '<span class="travel missing">🚐 No place found for Maps</span>';
    } else if (t.label) {
      before = t.leg && t.leg.minutes !== null
        ? `<span class="travel"${marginTitle(t.leg)}>🚐 ${escapeHtml(minutesText(t.leg.minutes))} · ${t.leg.km} km <small>${escapeHtml(t.label)}</small></span>`
        : `<span class="travel missing">🚐 Driving time not calculated yet <small>${escapeHtml(t.label)}</small></span>`;
    }

    let after = '';

    if (t.back) {
      after = t.back !== 'missing' && t.back.minutes !== null
        ? `<span class="travel back"${marginTitle(t.back)}>↩ ${escapeHtml(minutesText(t.back.minutes))} · ${t.back.km} km back to warehouse${schedule && schedule.back !== null ? ' · ~' + clock(schedule.back) : ''}</span>`
        : '<span class="travel back missing">↩ Return time not calculated yet</span>';
    }

    return { before, after };

  }


  function renderCardCell(i) {

    const cell = $('card-' + i);
    const ev = rowEvents[i];
    const num = field(i, 'number').value.trim();
    const tr = travelHtml(i);

    const t = travel[i];

    if (ev && ev.lunch) {
      cell.innerHTML = `
        <div class="card-link lunch">
          <span class="cl-time">🍽 Lunch${t ? ' · ' + escapeHtml(timeRange(t)) : ''}</span>
          <span class="cl-title">${LUNCH_MIN} min break</span>
        </div>`;
    } else if (ev) {
      cell.innerHTML = tr.before + `
        <button type="button" class="card-link" data-card="${i}" style="--c:${safeHex(ev.colorHex)}" title="Open details">
          <span class="cl-time">${t ? escapeHtml(timeRange(t)) : escapeHtml(timeLabel(ev))}</span>
          <span class="cl-title">${escapeHtml(ev.title)}</span>
          ${ev.location ? `<span class="cl-loc">${escapeHtml(ev.location)}</span>` : ''}
        </button>` + tr.after;
    } else if (num) {
      cell.innerHTML = '<span class="no-event">No calendar event for this PP / OS</span>';
    } else {
      cell.innerHTML = '';
    }

  }


  function renderDuration(i) {

    const sel = field(i, 'duration');
    const d = rowDur[i];
    const key = rowKey(i);

    if (rowEvents[i] && rowEvents[i].lunch) {
      sel.value = String(LUNCH_MIN);
      sel.classList.remove('set');
      $('row-' + i).classList.remove('flagged');
      $('dur-plan-' + i).textContent = 'Lunch break';
      $('dur-by-' + i).textContent = '';
      return;
    }

    sel.value = d && d.duration ? String(d.duration) : '';
    sel.classList.toggle('set', !!(d && d.duration));

    // planned (calendar) vs real (chosen) -> red flag
    const planned = key ? plannedOf(rowEvents[i]) : null;
    const real = d && d.duration ? d.duration : null;
    const flagged = !!(planned && real && planned !== real);

    $('row-' + i).classList.toggle('flagged', flagged);
    $('dur-plan-' + i).innerHTML = !planned ? ''
      : `Planned ${escapeHtml(minutesText(planned))}` +
        (flagged ? ` <span class="flag">🚩 ${real > planned ? '+' : '−'}${escapeHtml(minutesText(Math.abs(real - planned)))}</span>` : '');

    const by = $('dur-by-' + i);
    by.classList.toggle('saved', justSaved[i]);

    if (!key) {
      by.textContent = '';
    } else if (justSaved[i]) {
      by.textContent = '✓ Saved';
    } else if (d && d.durationBy) {
      by.textContent = `${d.duration ? '' : 'Cleared · '}${d.durationBy} · ${shortTime(d.durationAt)}`;
    } else if (isAdmin && !savedKeys.has(key)) {
      by.textContent = 'Save the sheet to allow durations';
    } else {
      by.textContent = '';
    }

  }


  // mobile (admin) shows only the filled rows + the next empty one; team sees filled rows
  function markRows() {

    let nextSet = false;

    for (let i = 0; i < ROWS; i++) {
      const tr = $('row-' + i);
      const empty = !rowKey(i) && !manualMode[i];
      tr.classList.toggle('empty', empty);
      tr.classList.toggle('next', empty && !nextSet);
      if (empty) nextSet = true;
    }

  }


  function renderRows() {

    const used = new Set();
    for (let i = 0; i < ROWS; i++) {
      const k = rowKey(i);
      if (k) used.add(k);
    }

    if (isAdmin) computeTravel();

    for (let i = 0; i < ROWS; i++) {
      if (isAdmin) renderPick(i, used);
      renderRefs(i);
      renderCardCell(i);
      renderDuration(i);
    }

    markRows();
    applyLock();
    schedulePreview();

  }


  // Match the row's PP / OS with an event of the sheet date
  function linkRow(i) {

    if (rowEvents[i] && rowEvents[i].lunch && !manualMode[i]) return;

    const kind = field(i, 'kind').value;
    const num = field(i, 'number').value.trim();

    if (!num) {
      const kept = rowEvents[i];
      if (kept && !kept.number && !manualMode[i] && kept.date === sheetIsoDate()) {
        const live = dayEvents.find(ev => evKey(ev) === evKey(kept));
        if (live) rowEvents[i] = snapshot(live);
      } else {
        rowEvents[i] = null;
      }
      return;
    }

    const live = findEvent(kind, num);
    const kept = rowEvents[i];

    if (live) {
      rowEvents[i] = snapshot(live);
    } else if (!(kept && kept.kind === kind && kept.number === num && kept.date === sheetIsoDate())) {
      rowEvents[i] = null;
    }

  }


  // row content changed (admin): the old duration no longer belongs to it
  function resetRowDuration(i) {
    rowDur[i] = null;
    justSaved[i] = false;
  }


  function onPick(i) {

    const value = field(i, 'pick').value;

    resetRowDuration(i);

    if (value === MANUAL) {
      manualMode[i] = true;
      field(i, 'number').value = '';
      rowEvents[i] = null;
      renderRows();
      field(i, 'number').focus();
      return;
    }

    manualMode[i] = false;

    if (!value) {
      field(i, 'kind').value = 'PP';
      field(i, 'number').value = '';
      rowEvents[i] = null;
    } else if (value === LUNCH_KEY) {
      field(i, 'kind').value = 'PP';
      field(i, 'number').value = '';
      rowEvents[i] = lunchEvent();
    } else if (value.startsWith('T:')) {
      // event without PP / OS: link the event, leave the number empty
      const ev = dayEvents.find(x => evKey(x) === value);
      field(i, 'kind').value = 'PP';
      field(i, 'number').value = '';
      rowEvents[i] = ev ? snapshot(ev) : null;
    } else {
      const [kind, number] = value.split(':');
      field(i, 'kind').value = kind;
      field(i, 'number').value = number;
      linkRow(i);
    }

    renderRows();

  }


  function fillRoute() {

    const route = routes.find(r => r.name === currentRoute);
    if (!route) return;

    const used = new Set();
    for (let i = 0; i < ROWS; i++) {
      const k = rowKey(i);
      if (k) used.add(k);
    }

    let placed = 0;
    let noRoom = 0;

    for (const ev of route.events) {

      const k = evKey(ev);
      if (used.has(k)) continue;

      let row = -1;
      for (let i = 0; i < ROWS; i++) {
        if (!rowKey(i) && !manualMode[i]) { row = i; break; }
      }

      if (row === -1) { noRoom++; continue; }

      resetRowDuration(row);
      field(row, 'kind').value = ev.kind || 'PP';
      field(row, 'number').value = ev.number || '';
      if (ev.number) linkRow(row);
      else rowEvents[row] = snapshot(ev);
      used.add(k);
      placed++;

    }

    renderRows();

    setStatus(
      `${placed} added from ${currentRoute}` + (noRoom ? ` · ${noRoom} did not fit (sheet full)` : '') + ' – remember to Save',
      noRoom ? 'err' : 'ok'
    );

  }


  // =========================================
  // ROUTE PREVIEW (map + timeline)
  // =========================================

  // Stops of the preview: the sheet rows, or (admin, empty sheet) the route from the calendar
  function previewStops() {

    const stops = [];

    for (let i = 0; i < ROWS; i++) {
      if (rowKey(i) && rowEvents[i]) stops.push({ ev: rowEvents[i], row: i });
    }

    if (!stops.length && isAdmin) {
      const route = routes.find(r => r.name === currentRoute);
      if (route) route.events.forEach(e => stops.push({ ev: snapshot(e), row: -1 }));
    }

    return stops;

  }


  // Legs to save with the sheet: only the ones this route uses
  function buildPlan() {

    const { legs, wh, whc } = rawLegsSource();
    const places = [];

    for (let i = 0; i < ROWS; i++) {
      if (rowKey(i) && rowEvents[i] && mapsPlace(rowEvents[i])) places.push(mapsPlace(rowEvents[i]));
    }

    const chain = wh ? [wh, ...places, wh] : places;
    const used = {};

    for (let k = 1; k < chain.length; k++) {
      const key = chain[k - 1] + '→' + chain[k];
      if (legs[key]) used[key] = legs[key];
    }

    return { warehouse: wh, warehouseCoords: whc, legs: used };

  }


  let previewTimer = null;

  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(renderPreview, 30);
  }


  let previewEvents = [];

  function renderPreview() {

    const stops = previewStops();
    const { legs, wh } = legsSource();
    const showDrive = isAdmin;          // driving times: admin only

    previewEvents = stops.map(s => s.ev);

    const hasRoute = !!(stops.length);
    $('pv-grid').classList.toggle('hidden', !hasRoute);
    $('pv-empty').classList.toggle('hidden', hasRoute);
    $('pv-empty').textContent = !sheetIsoDate() ? 'Choose the date and the route.'
      : !currentRoute ? 'Choose a route to see the preview.'
      : 'No deliveries on this route.';

    // Google Maps link (everyone) – exact points when known
    const { whc } = legsSource();
    const places = stops.map(s => mapsTarget(s.ev)).filter(Boolean);
    const link = $('route-map');
    const home = whc || wh;

    if (places.length) {
      const origin = home || places[0];
      const destination = home || places[places.length - 1];
      const waypoints = home ? places : places.slice(1, -1);
      link.href = 'https://www.google.com/maps/dir/?api=1&travelmode=driving' +
        '&origin=' + encodeURIComponent(origin) +
        '&destination=' + encodeURIComponent(destination) +
        (waypoints.length ? '&waypoints=' + encodeURIComponent(waypoints.join('|')) : '');
      link.classList.remove('hidden');
    } else {
      link.classList.add('hidden');
    }

    if (!hasRoute) {
      $('pv-sum').textContent = '';
      return;
    }

    // ---- timeline (from the schedule) ----
    const sc = buildSchedule(stops);
    const driveHtml = leg => !showDrive ? ''
      : leg && leg.minutes !== null
        ? `<div class="pv-drive"${marginTitle(leg)}>🚐 ${escapeHtml(minutesText(leg.minutes))} · ${leg.km} km</div>`
        : '<div class="pv-drive missing">🚐 driving time not calculated yet</div>';

    let flags = 0, n = 0;
    const items = [];

    if (wh) {
      items.push(`
        <li class="pv-item">
          <span class="pv-num wh">W</span>
          <div class="pv-wh"><strong>Leave warehouse ${DEPART_TIME}</strong> <small>${escapeHtml(wh)}</small></div>
        </li>`);
    }

    sc.items.forEach((it, k) => {

      if (it.lunch) {
        items.push(`
          <li class="pv-item">
            <span class="pv-num wh">🍽</span>
            <div class="pv-wh"><strong>Lunch</strong> <small>${escapeHtml(timeRange(it))} · ${LUNCH_MIN} min</small></div>
          </li>`);
        return;
      }

      n++;
      const ev = it.ev;
      const d = it.row >= 0 ? rowDur[it.row] : null;
      const real = d && d.duration ? d.duration : null;
      const flagged = isAdmin && it.planned && real && it.planned !== real;
      if (flagged) flags++;

      const refs = ev.refs && ev.refs.length ? refsText(ev.refs) : '';

      items.push(`
        <li class="pv-item" style="--c:${safeHex(ev.colorHex)}">
          <span class="pv-num">${n}</span>
          <div>
            ${it.label ? driveHtml(it.leg) : ''}
            <button type="button" class="pv-card" data-pv="${k}">
              <strong>${escapeHtml(timeRange(it))}</strong>${it.service ? ` <small style="display:inline">· ${escapeHtml(minutesText(it.service))}${it.serviceFrom === 'real' ? '' : ' planned'}</small>` : ''}
              <span class="t">${escapeHtml(ev.title)}</span>
              ${refs ? `<small>${escapeHtml(refs)}</small>` : ''}
            </button>
            ${flagged ? `<span class="flag">🚩 Real ${escapeHtml(minutesText(real))} · planned ${escapeHtml(minutesText(it.planned))}</span>` : ''}
          </div>
        </li>`);

    });

    if (wh) {
      items.push(`
        <li class="pv-item">
          <span class="pv-num wh">W</span>
          <div>
            ${driveHtml(sc.backLeg)}
            <div class="pv-wh"><strong>Back at warehouse</strong>${sc.back !== null ? ` <small>${sc.uncertain ? '~ ' : ''}${clock(sc.back)}</small>` : ''}</div>
          </div>
        </li>`);
    }

    $('pv-list').innerHTML = items.join('');

    $('pv-sum').textContent =
      `· ${n} deliver${n === 1 ? 'y' : 'ies'}` +
      ` · ${DEPART_TIME} → ${sc.back !== null ? (sc.uncertain ? '~' : '') + clock(sc.back) : clock(sc.end)}` +
      (showDrive && sc.totalDrive ? ` · driving ${minutesText(sc.totalDrive)} (incl. ${DRIVE_MARGIN} min margin per trip) · ${Math.round(sc.km)} km` : '') +
      (flags ? ` · 🚩 ${flags}` : '');

    drawMap(stops, legs, wh);

  }


  // ---- map (Leaflet + OpenStreetMap, loaded only when needed) ----

  let leafletPromise = null;

  function loadLeaflet() {

    if (window.L) return Promise.resolve();
    if (leafletPromise) return leafletPromise;

    const sources = [
      'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/',
      'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/'
    ];

    const tryLoad = base => new Promise((resolve, reject) => {
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = base + 'leaflet.css';
      document.head.appendChild(css);
      const js = document.createElement('script');
      js.src = base + 'leaflet.js';
      js.onload = resolve;
      js.onerror = reject;
      document.head.appendChild(js);
    });

    leafletPromise = tryLoad(sources[0]).catch(() => tryLoad(sources[1]));
    leafletPromise.catch(() => { leafletPromise = null; });

    return leafletPromise;

  }


  let map = null;
  let mapLayer = null;

  function mapMessage(text) {
    const msg = $('pv-map-msg');
    msg.textContent = text;
    msg.classList.toggle('hidden', !text);
  }


  async function drawMap(stops, legs, wh) {

    // coordinates come from the driving legs (start / end points)
    const places = stops.map(s => mapsPlace(s.ev));
    const chain = wh ? [wh, ...places, wh] : places;
    const coord = {};
    const paths = [];

    for (let k = 1; k < chain.length; k++) {
      const leg = chain[k - 1] && chain[k] ? legs[chain[k - 1] + '→' + chain[k]] : null;
      if (!leg) continue;
      if (leg.a) coord[chain[k - 1]] = coord[chain[k - 1]] || leg.a;
      if (leg.b) coord[chain[k]] = coord[chain[k]] || leg.b;
      if (leg.poly) paths.push({ line: decodePolyline(leg.poly), dashed: false });
      else if (leg.a && leg.b) paths.push({ line: [leg.a, leg.b], dashed: true });
    }

    // exact points from the Apps Script (map shows the stops even before driving times exist)
    const asPoint = v => {
      const m = String(v || '').match(/^(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/);
      return m ? [Number(m[1]), Number(m[2])] : null;
    };
    const { whc } = legsSource();
    if (wh && !coord[wh] && asPoint(whc)) coord[wh] = asPoint(whc);
    stops.forEach(s => {
      const pl = mapsPlace(s.ev);
      if (pl && !coord[pl] && asPoint(s.ev.coords)) coord[pl] = asPoint(s.ev.coords);
    });

    if (!Object.keys(coord).length) {
      if (map) { mapLayer.clearLayers(); }
      mapMessage('The map appears once the Apps Script has found the places (next sync).');
      return;
    }

    try {
      await loadLeaflet();
    } catch {
      mapMessage('Map could not be loaded (no internet?). Use "Open route in Maps".');
      return;
    }

    mapMessage('');

    if (!map) {
      map = L.map('pv-map', { scrollWheelZoom: false });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      mapLayer = L.layerGroup().addTo(map);
    }

    mapLayer.clearLayers();

    const color = safeHex((stops[0] && stops[0].ev.colorHex) || routeHex);
    const bounds = [];

    for (const p of paths) {
      L.polyline(p.line, { color, weight: 4, opacity: .8, dashArray: p.dashed ? '6 8' : null }).addTo(mapLayer);
      bounds.push(...p.line);
    }

    const pin = (latlng, text, bg, title) => {
      L.marker(latlng, {
        title,
        icon: L.divIcon({
          className: '',
          html: `<div class="pv-pin" style="background:${bg}">${escapeHtml(text)}</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        })
      }).addTo(mapLayer);
      bounds.push(latlng);
    };

    if (wh && coord[wh]) pin(coord[wh], 'W', '#2b2b2b', 'Warehouse');

    let n = 0;
    places.forEach((pl, k) => {
      if (stops[k].ev.lunch) return;
      n++;
      if (pl && coord[pl]) pin(coord[pl], String(n), safeHex(stops[k].ev.colorHex), stops[k].ev.title || '');
    });

    if (bounds.length) map.fitBounds(bounds, { padding: [24, 24], maxZoom: 13 });

    setTimeout(() => map && map.invalidateSize(), 50);

  }


  // =========================================
  // DELIVERY DURATION (admin)
  // =========================================

  async function onDuration(i) {

    const sel = field(i, 'duration');
    const key = rowKey(i);
    const value = sel.value;

    if (!sheetSaved || !savedKeys.has(key)) {
      renderDuration(i);
      setStatus('Save the sheet first, then choose the duration', 'err');
      return;
    }

    sel.disabled = true;
    setStatus('Saving duration…');

    try {

      const res = await api(`/api/sheets/${currentId}/duration`, {
        method: 'POST',
        body: JSON.stringify({ key, minutes: value === '' ? null : Number(value) })
      });

      rowDur[i] = {
        duration: res.row.duration,
        durationBy: res.row.durationBy,
        durationAt: res.row.durationAt
      };

      // bring in any change made by the others since the page was opened
      await reloadCurrent(true);

      justSaved[i] = true;
      setTimeout(() => { justSaved[i] = false; renderDuration(i); }, 4000);

      setStatus('Duration saved ' + new Date().toLocaleTimeString('en-GB'), 'ok');

    } catch (err) {

      setStatus('Duration not saved: ' + err.message, 'err');
      if (/closed/i.test(err.message)) reloadCurrent(true);

    }

    sel.disabled = sheetStatus === 'closed';
    renderDuration(i);
    loadList();

  }


  // =========================================
  // CARD (modal)
  // =========================================

  function openCard(i) {
    openCardEv(rowEvents[i]);
  }


  function openCardEv(ev) {

    if (!ev) return;

    const [y, m, d] = (ev.date || '').split('-').map(Number);
    const dateText = y
      ? `${WEEKDAYS[(new Date(y, m - 1, d).getDay() + 6) % 7]} ${ordinal(d)} ${MONTHS[m - 1]} ${y}`
      : '';

    $('cm-box').style.setProperty('--c', safeHex(ev.colorHex));
    $('cm-color').textContent = ev.colorName || '';
    $('cm-ref').textContent =
      (ev.refs && ev.refs.length) ? refsText(ev.refs)
      : ev.number ? `${ev.kind} ${ev.number}` : 'No PP / OS';
    $('cm-when').textContent = [dateText, 'calendar slot ' + timeLabel(ev)].filter(Boolean).join(' · ');
    $('cm-title').textContent = ev.title || '';

    const where = mapsPlace(ev);
    $('cm-loc-block').classList.toggle('hidden', !where);
    $('cm-loc').textContent = ev.location || (where ? where + ' (area from the title)' : '');
    $('cm-map').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(where);

    const desc = descriptionText(ev.description);
    $('cm-desc-block').classList.toggle('hidden', !desc);
    $('cm-desc').innerHTML = linkify(escapeHtml(desc));

    $('card-modal').classList.remove('hidden');

  }


  function closeModals() {
    document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden'));
  }


  // =========================================
  // ANSWERS (admin)
  // =========================================

  let answersCache = [];

  async function openAnswers() {

    if (!sheetSaved) return;

    try {

      await reloadCurrent(true);   // latest durations from everybody
      answersCache = await api(`/api/sheets/${currentId}/responses`);

    } catch (err) {

      setStatus('Could not load answers: ' + err.message, 'err');
      return;

    }

    const rows = [];

    for (let i = 0; i < ROWS; i++) {
      const key = rowKey(i);
      if (!key || (rowEvents[i] && rowEvents[i].lunch)) continue;
      rows.push({ i, key });
    }

    const d = sheetIsoDate();
    const answered = rows.filter(r => rowDur[r.i] && rowDur[r.i].duration).length;
    const flagCount = rows.filter(r => {
      const p = plannedOf(rowEvents[r.i]);
      return p && rowDur[r.i] && rowDur[r.i].duration && rowDur[r.i].duration !== p;
    }).length;

    $('ans-sub').textContent =
      `${d ? d.split('-').reverse().join('/') : ''} · ${currentRoute || 'no route'} · ` +
      `${answered} of ${rows.length} deliveries with duration · ${answersCache.length} answer${answersCache.length === 1 ? '' : 's'}` +
      (flagCount ? ` · 🚩 ${flagCount} to check with the driver` : '') +
      (sheetStatus === 'closed' ? ` · closed by ${sheetInfo.closedBy}` : ' · day still open');

    $('ans-body').innerHTML = rows.map(({ i, key }) => {

      const ev = rowEvents[i];
      const title = ev ? `${timeLabel(ev)} · ${ev.title}` : rowRefText({ kind: field(i, 'kind').value, number: field(i, 'number').value.trim(), event: null });
      const dur = rowDur[i];
      const hist = answersCache.filter(a => a.key === key);
      const planned = plannedOf(ev);
      const flagged = planned && dur && dur.duration && planned !== dur.duration;

      return `
        <div class="ans-item">
          <div class="ans-head">
            <strong>${escapeHtml(title)}</strong>
            ${planned ? `<small class="answers-sub" style="margin:0">Planned ${escapeHtml(minutesText(planned))}</small>` : ''}
            ${dur && dur.duration
              ? `<span class="ans-final">${escapeHtml(durationLabel(dur.duration))}</span>`
              : '<span class="ans-final none">No duration</span>'}
            ${flagged ? `<span class="flag">🚩 ${dur.duration > planned ? '+' : '−'}${escapeHtml(minutesText(Math.abs(dur.duration - planned)))}</span>` : ''}
          </div>
          ${hist.length ? `<ul class="ans-hist">${hist.map(a => `
            <li>${escapeHtml(shortTime(a.at))} · ${escapeHtml(a.name)}${a.admin ? ' (admin)' : ''} → ${a.minutes ? escapeHtml(durationLabel(a.minutes)) : 'cleared'}</li>`).join('')}
          </ul>` : ''}
        </div>`;

    }).join('') || '<p class="answers-sub">No deliveries on this sheet.</p>';

    $('answers-modal').classList.remove('hidden');

  }


  function downloadCsv() {

    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const date = sheetIsoDate();

    const lines = [['Date', 'Route', 'Delivery', 'PP / OS', 'Planned (min)', 'Final duration (min)', 'Difference (min)', 'Red flag', 'Answer by', 'Answer (min)', 'Answered at'].map(q).join(',')];

    for (let i = 0; i < ROWS; i++) {

      const key = rowKey(i);
      if (!key || (rowEvents[i] && rowEvents[i].lunch)) continue;

      const ev = rowEvents[i];
      const ref = rowRefText({ kind: field(i, 'kind').value, number: field(i, 'number').value.trim(), event: ev });
      const title = ev ? ev.title : '';
      const final = rowDur[i] && rowDur[i].duration ? rowDur[i].duration : '';
      const hist = answersCache.filter(a => a.key === key);
      const planned = plannedOf(ev) || '';
      const diff = planned && final ? final - planned : '';
      const flag = planned && final && diff !== 0 ? 'YES' : '';
      const base = [date, currentRoute, title, ref, planned, final, diff, flag];

      if (!hist.length) {
        lines.push([...base, '', '', ''].map(q).join(','));
      }

      for (const a of hist) {
        lines.push([...base, a.name, a.minutes ?? '', new Date(a.at).toLocaleString('en-GB')].map(q).join(','));
      }

    }

    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `durations-${date || 'sheet'}-${(currentRoute || 'route').toLowerCase().replace(/\s+/g, '-')}.csv`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

  }


  // =========================================
  // CALENDAR LOAD (admin)
  // =========================================

  async function loadCalendar() {

    if (!isAdmin) return;

    calDate = sheetIsoDate();

    if (!calDate) {
      dayEvents = [];
      routes = [];
      dayLegs = {};
      renderRoute();
      for (let i = 0; i < ROWS; i++) linkRow(i);
      renderRows();
      return;
    }

    const asked = calDate;

    try {

      const data = await api('/api/calendar?date=' + asked);

      if (asked !== calDate) return;   // date changed meanwhile

      calColor = data.calendarColor || '';
      syncedAt = data.syncedAt || null;
      dayLegs = data.legs || {};
      warehouse = data.warehouse || '';
      whCoords = data.warehouseCoords || '';
      dayEvents = (data.events || []).filter(ev => !isIgnored(ev)).map(prepareEvent);

      buildRoutes();

      // no route chosen yet -> guess it from the rows already on the sheet
      if (!currentRoute) {
        const linked = rowEvents.find(Boolean);
        if (linked && routes.some(r => r.name === linked.colorName)) currentRoute = linked.colorName;
      }

      // closed sheets keep exactly what was saved
      if (sheetStatus !== 'closed') {
        for (let i = 0; i < ROWS; i++) linkRow(i);
      }

      renderRoute();
      renderRows();

    } catch (err) {

      setStatus('Could not load calendar events', 'err');

    }

  }


  // =========================================
  // READ / WRITE FORM
  // =========================================

  function readForm() {

    const rows = [];

    for (let i = 0; i < ROWS; i++) {
      rows.push({
        key: rowKey(i),
        kind: field(i, 'kind').value,
        number: field(i, 'number').value.trim(),
        event: rowEvents[i]
      });
    }

    const d = $('date-day').value;
    const m = $('date-month').value;
    const y = $('date-year').value;

    return {
      date: {
        day: d,
        month: m,
        year: y,
        text: (d && m && y) ? `${ordinal(Number(d))} ${MONTHS[m - 1]} ${y}` : ''
      },
      day: $('weekday').value,
      route: currentRoute,
      routeHex: currentRoute ? routeHex : '',
      rows,
      plan: buildPlan(),
      signOut: $('sign-out').value.trim(),
      signIn: $('sign-in').value.trim()
    };

  }


  function writeForm(sheet) {

    const date = sheet.date || {};

    $('date-year').value = date.year || String(YEARS[0]);
    $('date-month').value = date.month || '';
    refreshDays();
    $('date-day').value = date.day || '';

    $('weekday').value = sheet.day || '';

    $('ro-date').textContent = date.text || '—';
    $('ro-day').textContent = sheet.day || '—';

    currentRoute = sheet.route || '';
    routeHex = sheet.routeHex || '';

    sheetStatus = sheet.status || 'open';
    sheetInfo = { closedBy: sheet.closedBy, closedAt: sheet.closedAt, updatedAt: sheet.updatedAt };
    sheetPlan = sheet.plan || null;

    const rows = sheet.rows || [];

    savedKeys = new Set();

    for (let i = 0; i < ROWS; i++) {
      const row = rows[i] || {};
      field(i, 'kind').value = row.kind || 'PP';
      field(i, 'number').value = row.number || '';
      rowEvents[i] = row.event || null;
      manualMode[i] = !!row.number && !row.event;
      rowDur[i] = row.duration || row.durationBy
        ? { duration: row.duration, durationBy: row.durationBy, durationAt: row.durationAt }
        : null;
      justSaved[i] = false;
      if (row.key) savedKeys.add(row.key);
    }

    $('sign-out').value = sheet.signOut || '';
    $('sign-in').value = sheet.signIn || '';

    renderRoute();
    renderRows();
    renderList();

  }


  // Only durations / status from the server (keeps the admin's unsaved edits)
  function mergeDurations(sheet) {

    sheetStatus = sheet.status || 'open';
    sheetInfo = { closedBy: sheet.closedBy, closedAt: sheet.closedAt, updatedAt: sheet.updatedAt };

    const byKey = {};
    for (const r of (sheet.rows || [])) if (r.key) byKey[r.key] = r;

    for (let i = 0; i < ROWS; i++) {
      const r = byKey[rowKey(i)];
      if (r && (r.duration || r.durationBy)) {
        rowDur[i] = { duration: r.duration, durationBy: r.durationBy, durationAt: r.durationAt };
      }
    }

    renderRows();

  }


  // =========================================
  // API
  // =========================================

  async function api(path, options = {}) {

    const headers = {
      'content-type': 'application/json',
      'x-user-name': encodeURIComponent(userName),
      ...(options.headers || {})
    };

    if (adminToken) headers['x-admin-token'] = adminToken;

    const res = await fetch(path, { ...options, headers });

    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);

    return res.json();

  }


  function renderList() {

    $('saved-count').textContent = sheetList.length;

    $('saved-list').innerHTML = sheetList.map(s => {

      const done = s.deliveries && s.answered === s.deliveries;
      const pill = s.status === 'closed'
        ? '<span class="pill closed">Closed</span>'
        : isAdmin ? `<span class="pill ${done ? 'done' : ''}">${s.answered || 0}/${s.deliveries || 0} durations</span>` : '';
      const flagPill = isAdmin && s.flags ? ` <span class="flag">🚩 ${s.flags}</span>` : '';

      return `
