<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Sheet</title>
<style>
  :root {
    --ink: #1d1d1f;
    --line: #2b2b2b;
    --muted: #6b6b6b;
    --bg: #eef0f3;
    --paper: #ffffff;
    --accent: #1f5fbf;
    --ok: #1e8a4c;
    --danger: #c0392b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  .hidden { display: none !important; }

  /* ---------- NAME GATE ---------- */

  #gate, #card-modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 24, 31, .75);
    z-index: 50;
    padding: 16px;
  }

  .gate-card {
    background: var(--paper);
    border-radius: 12px;
    padding: 28px 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
  }

  .gate-card h1 { margin: 0 0 6px; font-size: 22px; }
  .gate-card p { margin: 0 0 18px; color: var(--muted); }

  .gate-card input {
    width: 100%;
    font-size: 17px;
    padding: 10px 12px;
    border: 1px solid #bbb;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  /* ---------- TOOLBAR ---------- */

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #d5d8dd;
  }

  .toolbar .user { font-weight: 600; margin-right: auto; }
  .toolbar .user small { font-weight: 400; color: var(--muted); }

  button, .btn {
    font: inherit;
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #c4c8ce;
    background: #fff;
    cursor: pointer;
  }

  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button.link { border: 0; background: none; color: var(--accent); padding: 0 4px; }
  button.small { font-size: 13px; padding: 4px 10px; }

  #status { font-size: 14px; color: var(--muted); min-width: 120px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--danger); }

  /* ---------- SAVED LIST + CALENDAR PANELS ---------- */

  .panel {
    max-width: 820px;
    margin: 12px auto 0;
    padding: 0 16px;
  }

  .panel > details {
    background: #fff;
    border: 1px solid #d5d8dd;
    border-radius: 8px;
    padding: 8px 12px;
  }

  .panel summary { cursor: pointer; font-weight: 600; }
  .panel summary small { font-weight: 400; color: var(--muted); }

  #saved-list { list-style: none; padding: 0; margin: 8px 0 0; }

  #saved-list li {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 6px 0;
    border-top: 1px solid #eee;
    font-size: 14px;
  }

  #saved-list li span { flex: 1; }
  #saved-list li small { color: var(--muted); }

  .cal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin: 8px 0 10px;
  }

  .cal-actions small { color: var(--muted); margin-right: auto; }

  .muted { color: var(--muted); font-size: 14px; padding: 6px 0; }

  .cal-groups {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 12px;
  }

  .cal-group {
    border: 1px solid #dfe2e6;
    border-top: 5px solid var(--c, #999);
    border-radius: 8px;
    overflow: hidden;
  }

  .cal-group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #fafbfc;
  }

  .cal-group-head strong { font-size: 16px; }
  .cal-group-head small { color: var(--muted); margin-right: auto; }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--c, #999);
    flex: 0 0 auto;
  }

  .cal-group ul { list-style: none; margin: 0; padding: 0; }

  .cal-group li label {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    align-items: start;
    padding: 7px 10px;
    border-top: 1px solid #eee;
    font-size: 14px;
    cursor: pointer;
  }

  .cal-group li.added label, .cal-group li.noref label { cursor: default; }
  .cal-group li.added label { opacity: .5; }
  .cal-group input[type=checkbox] { width: 18px; height: 18px; margin: 1px 0 0; }

  .ev-time { display: block; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .ev-loc { display: block; color: var(--muted); font-size: 13px; }

  .ref {
    font-weight: 700;
    white-space: nowrap;
    padding: 2px 8px;
    border-radius: 6px;
    background: #eef3fb;
    font-size: 13px;
  }

  .ref.none { background: #fdf0ee; color: var(--danger); font-weight: 400; }

  /* ---------- PAPER ---------- */

  .paper {
    background: var(--paper);
    max-width: 820px;
    margin: 12px auto 24px;
    padding: 22px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
  }

  .sheet { border: 2px solid var(--line); }

  .head {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 24px;
    padding: 12px 14px;
    border-bottom: 2px solid var(--line);
  }

  .field label, .label {
    display: block;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 4px;
  }

  .date-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .date-row .sep { font-weight: 700; font-size: 18px; }

  select, input[type=text] {
    font: inherit;
    font-size: 16px;
    padding: 6px 8px;
    border: 0;
    border-bottom: 2px solid var(--line);
    background: transparent;
    border-radius: 0;
    min-width: 0;
  }

  select:focus, input[type=text]:focus {
    outline: none;
    border-bottom-color: var(--accent);
    background: #f4f8ff;
  }

  .wide { width: 100%; }

  /* ---------- DELIVERIES ---------- */

  table.deliveries {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  table.deliveries th,
  table.deliveries td {
    border: 2px solid var(--line);
    padding: 4px 6px;
  }

  table.deliveries tr > :first-child { border-left: 0; }
  table.deliveries tr > :last-child { border-right: 0; }
  table.deliveries tr:last-child td { border-bottom: 0; }
  table.deliveries thead th { border-top: 0; }

  table.deliveries th { font-size: 20px; font-weight: 700; }

  table.deliveries td { height: 60px; vertical-align: middle; }

  col.c-card { width: 38%; }
  col.c-pp { width: 27%; }

  .pp {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .pp select { flex: 0 0 auto; font-weight: 700; }
  .pp input { flex: 1; width: 100%; }

  .times {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 6px;
  }

  .times .dash { font-weight: 700; font-size: 20px; }
  .times select { width: 100%; }

  /* shortcut card in the first column */
  .card-link {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 13px;
    line-height: 1.25;
    padding: 4px 8px;
    border: 1px solid #d5d8dd;
    border-left: 6px solid var(--c, #999);
    border-radius: 6px;
    background: #fafbfc;
  }

  .card-link:hover { background: #f1f5fb; }

  .card-link .cl-time { font-weight: 700; }
  .card-link .cl-title,
  .card-link .cl-loc {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-link .cl-loc { color: var(--muted); }

  .no-event { font-size: 13px; color: var(--muted); font-style: italic; }

  .sign {
    padding: 22px 14px 6px;
    display: grid;
    gap: 16px;
    max-width: 420px;
    margin: 0 auto;
  }

  .sign input { width: 100%; }

  /* ---------- CARD (modal) ---------- */

  .card-box {
    background: var(--paper);
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow: auto;
    border-radius: 12px;
    border-top: 10px solid var(--c, #999);
    padding: 16px 20px 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
  }

  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-top .chip { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin-right: auto; }

  .cm-ref { font-size: 26px; font-weight: 700; margin: 8px 0 2px; }
  .cm-when { color: var(--muted); font-size: 15px; }
  .card-box h2 { font-size: 19px; margin: 12px 0; }

  .cm-block { border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
  .cm-block .label { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .cm-desc { white-space: pre-wrap; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
  .card-box a { color: var(--accent); }

  @media (max-width: 640px) {
    .paper { padding: 8px; }
    table.deliveries th { font-size: 14px; }
    col.c-card { width: 36%; }
    col.c-pp { width: 32%; }
    .times { grid-template-columns: 1fr; gap: 2px; }
    .times .dash { display: none; }
    select, input[type=text] { font-size: 14px; padding: 4px; }
    .card-link { font-size: 12px; padding: 3px 6px; }
    .cal-groups { grid-template-columns: 1fr; }
  }

  /* ---------- PRINT (A4, like the paper form) ---------- */

  @media print {
    @page { size: A4; margin: 12mm; }

    body { background: #fff; }

    .toolbar, .panel, #gate, #card-modal { display: none !important; }

    .paper { box-shadow: none; margin: 0; padding: 0; max-width: none; }

    select {
      -webkit-appearance: none;
      appearance: none;
      background: none;
    }

    select, input[type=text] { border-bottom-color: transparent; }

    .head select, .sign input { border-bottom-color: var(--line); }

    .card-link { border: 0; background: none; padding: 0; }
    .no-event { display: none; }

    table.deliveries td { height: 64px; }
  }
</style>
</head>
<body>

<!-- ================= NAME GATE ================= -->
<div id="gate">
  <form class="gate-card" id="gate-form">
    <h1>Delivery Sheet</h1>
    <p>Please enter your name to continue.</p>
    <input id="gate-name" type="text" autocomplete="name" placeholder="Your name" maxlength="60" required>
    <button class="primary wide" type="submit">Enter</button>
  </form>
</div>

<!-- ================= EVENT CARD ================= -->
<div id="card-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="cm-title">
  <div class="card-box" id="cm-box">
    <div class="card-top">
      <span class="chip"><span class="dot"></span><span id="cm-color"></span></span>
      <button type="button" class="small" id="cm-close" aria-label="Close">Close</button>
    </div>
    <div class="cm-ref" id="cm-ref"></div>
    <div class="cm-when" id="cm-when"></div>
    <h2 id="cm-title"></h2>
    <div class="cm-block" id="cm-loc-block">
      <span class="label">Address</span>
      <div id="cm-loc"></div>
      <a id="cm-map" target="_blank" rel="noopener">Open in Google Maps</a>
    </div>
    <div class="cm-block" id="cm-desc-block">
      <span class="label">Event details</span>
      <div class="cm-desc" id="cm-desc"></div>
    </div>
  </div>
</div>

<!-- ================= TOOLBAR ================= -->
<div class="toolbar">
  <div class="user">
    <span id="who"></span>
    <button class="link" id="change-user" type="button">change</button>
  </div>
  <span id="status"></span>
  <button type="button" id="btn-new">New</button>
  <button type="button" class="primary" id="btn-save">Save</button>
  <button type="button" id="btn-print">Print</button>
</div>

<!-- ================= SAVED SHEETS ================= -->
<div class="panel" id="saved">
  <details>
    <summary>Saved sheets (<span id="saved-count">0</span>)</summary>
    <ul id="saved-list"></ul>
  </details>
</div>

<!-- ================= GOOGLE CALENDAR ================= -->
<div class="panel" id="calendar">
  <details open>
    <summary>Google Calendar <small id="cal-summary">– choose a date</small></summary>
    <div class="cal-actions">
      <small id="cal-synced"></small>
      <button type="button" id="cal-refresh">Refresh</button>
      <button type="button" class="primary" id="cal-add">Add selected to sheet</button>
    </div>
    <div id="cal-body"><div class="muted">Pick the date of the sheet to see that day's calendar events.</div></div>
  </details>
</div>

<!-- ================= SHEET ================= -->
<main class="paper">
  <div class="sheet">

    <div class="head">

      <div class="field">
        <span class="label">Date:</span>
        <div class="date-row">
          <select id="date-day" aria-label="Day of month"></select>
          <span class="sep">/</span>
          <select id="date-month" aria-label="Month"></select>
          <span class="sep">/</span>
          <select id="date-year" aria-label="Year"></select>
        </div>
      </div>

      <div class="field">
        <label for="weekday">Day:</label>
        <select id="weekday" class="wide"></select>
      </div>

    </div>

    <table class="deliveries">
      <colgroup>
        <col class="c-card"><col class="c-pp"><col>
      </colgroup>
      <thead>
        <tr>
          <th>Delivery</th>
          <th>PP / OS</th>
          <th>Time in &nbsp;-&nbsp; Time out</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

  </div>

  <div class="sign">
    <div class="field">
      <label for="sign-out">Sign out:</label>
      <input id="sign-out" type="text">
    </div>
    <div class="field">
      <label for="sign-in">Sign In:</label>
      <input id="sign-in" type="text">
    </div>
  </div>
</main>

<script>
(() => {

  // =========================================
  // CONSTANTS
  // =========================================

  const ROWS = 9;

  const MONTHS = [
    'January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'
  ];

  const WEEKDAYS = [
    'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'
  ];

  const YEARS = [2026, 2027];

  // 30 minutes -> 6 hours, every 15 minutes
  const DURATIONS = [];

  for (let m = 30; m <= 360; m += 15) {
    DURATIONS.push(m);
  }

  // Google Calendar event colours (colour id -> name, hex)
  const EVENT_COLORS = {
    '1': ['Lavender', '#7986cb'],
    '2': ['Sage', '#33b679'],
    '3': ['Grape', '#8e24aa'],
    '4': ['Flamingo', '#e67c73'],
    '5': ['Yellow', '#f6bf26'],
    '6': ['Orange', '#f4511e'],
    '7': ['Blue', '#039be5'],
    '8': ['Grey', '#616161'],
    '9': ['Dark blue', '#3f51b5'],
    '10': ['Green', '#0b8043'],
    '11': ['Red', '#d50000']
  };

  // Lists shown first, in this order
  const GROUP_ORDER = ['Orange', 'Blue'];

  const NAME_KEY = 'delivery-sheet:name';

  const $ = id => document.getElementById(id);

  const field = (i, f) => document.querySelector(`[data-row="${i}"][data-field="${f}"]`);


  // =========================================
  // HELPERS
  // =========================================

  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function durationLabel(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    const parts = [];
    if (h) parts.push(h + (h === 1 ? ' hour' : ' hours'));
    if (m) parts.push(m + ' minutes');
    return parts.join(' ');
  }

  function fillSelect(select, options, placeholder) {
    select.innerHTML = '';
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = placeholder;
    select.appendChild(empty);
    for (const [value, label] of options) {
      const opt = document.createElement('option');
      opt.value = String(value);
      opt.textContent = label;
      select.appendChild(opt);
    }
  }

  function safeGet(key) {
    try { return localStorage.getItem(key) || ''; } catch { return ''; }
  }

  function safeSet(key, value) {
    try { localStorage.setItem(key, value); } catch {}
  }

  function newId() {
    return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  }

  function setStatus(text, kind = '') {
    const el = $('status');
    el.textContent = text;
    el.className = kind;
  }

  function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function safeHex(hex) {
    return /^#[0-9a-f]{6}$/i.test(hex || '') ? hex : '#9e9e9e';
  }

  // Name for a colour that is not one of Google's event colours
  function hueName(hex) {
    const n = parseInt(safeHex(hex).slice(1), 16);
    const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if (d < 0.12) return 'Grey';
    let h;
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
    if (h < 12 || h >= 340) return 'Red';
    if (h < 45) return 'Orange';
    if (h < 70) return 'Yellow';
    if (h < 170) return 'Green';
    if (h < 260) return 'Blue';
    return 'Purple';
  }

  // Google Calendar descriptions may contain simple HTML -> plain text
  function descriptionText(html) {
    if (!html) return '';
    const withBreaks = String(html)
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(p|div|li)>/gi, '\n');
    const doc = new DOMParser().parseFromString(withBreaks, 'text/html');
    return (doc.body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  }

  function linkify(escaped) {
    return escaped.replace(/https?:\/\/[^\s<]+/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  }

  function timeLabel(ev) {
    return ev.allDay ? 'All day' : `${ev.start}–${ev.end}`;
  }


  // =========================================
  // BUILD FORM
  // =========================================

  function buildHeader() {

    fillSelect($('date-month'), MONTHS.map((name, i) => [i + 1, name]), 'Month');

    fillSelect($('date-year'), YEARS.map(y => [y, String(y)]), 'Year');

    $('date-year').value = String(YEARS[0]);

    fillSelect($('weekday'), WEEKDAYS.map(d => [d, d]), 'Select day');

    refreshDays();

  }


  // Day-of-month list follows the chosen month / year
  function refreshDays() {

    const select = $('date-day');
    const current = select.value;
    const month = Number($('date-month').value);
    const year = Number($('date-year').value) || YEARS[0];
    const max = month ? new Date(year, month, 0).getDate() : 31;

    const days = [];
    for (let d = 1; d <= max; d++) days.push([d, ordinal(d)]);

    fillSelect(select, days, 'Day');

    if (current && Number(current) <= max) select.value = current;

  }


  // Suggest the weekday from the chosen date (still editable)
  function suggestWeekday() {

    const d = Number($('date-day').value);
    const m = Number($('date-month').value);
    const y = Number($('date-year').value);

    if (!d || !m || !y) return;

    const js = new Date(y, m - 1, d).getDay();
    $('weekday').value = WEEKDAYS[(js + 6) % 7];

  }


  function buildRows() {

    const tbody = $('rows');
    const durationOptions = DURATIONS.map(m => [m, durationLabel(m)]);

    tbody.innerHTML = '';

    for (let i = 0; i < ROWS; i++) {

      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td id="card-${i}"></td>
        <td>
          <div class="pp">
            <select data-row="${i}" data-field="kind" aria-label="PP or OS">
              <option value="PP">PP</option>
              <option value="OS">OS</option>
            </select>
            <input type="text" data-row="${i}" data-field="number" inputmode="numeric" aria-label="PP / OS number">
          </div>
        </td>
        <td>
          <div class="times">
            <select data-row="${i}" data-field="timeIn" aria-label="Time in"></select>
            <span class="dash">-</span>
            <select data-row="${i}" data-field="timeOut" aria-label="Time out"></select>
          </div>
        </td>`;

      fillSelect(tr.querySelector('[data-field=timeIn]'), durationOptions, '—');
      fillSelect(tr.querySelector('[data-field=timeOut]'), durationOptions, '—');

      tbody.appendChild(tr);

    }

  }


  // =========================================
  // CALENDAR STATE
  // =========================================

  let calDate = '';
  let calColor = '';          // default colour of the calendar
  let dayEvents = [];         // events of the sheet date (already filtered)
  let hiddenCount = 0;

  // event linked to each row (copy kept inside the saved sheet)
  let rowEvents = new Array(ROWS).fill(null);


  // Events that never show: "1 van", "2 vans", no title, two-letter initials
  function isIgnored(ev) {
    const t = (ev.title || '').trim();
    if (!t || /^\(no title\)$/i.test(t)) return true;
    if (/^\d+\s*vans?$/i.test(t)) return true;
    if (/^\p{L}\.?\s*\p{L}\.?$/u.test(t)) return true;
    return false;
  }


  function colorOf(ev) {
    if (EVENT_COLORS[ev.colorId]) {
      const [name, hex] = EVENT_COLORS[ev.colorId];
      return { name, hex };
    }
    const hex = safeHex(calColor);
    return { name: hueName(hex), hex };
  }


  function sheetIsoDate() {

    const d = $('date-day').value;
    const m = $('date-month').value;
    const y = $('date-year').value;

    if (!d || !m || !y) return '';

    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

  }


  function numbersOnSheet() {

    const set = new Set();

    for (let i = 0; i < ROWS; i++) {
      const num = field(i, 'number').value.trim();
      if (num) set.add(field(i, 'kind').value + ':' + num);
    }

    return set;

  }


  function snapshot(ev) {
    const c = colorOf(ev);
    return {
      date: ev.date, start: ev.start, end: ev.end, allDay: !!ev.allDay,
      title: ev.title, location: ev.location, description: ev.description || '',
      kind: ev.kind, number: ev.number, colorName: c.name, colorHex: c.hex
    };
  }


  // =========================================
  // FIRST COLUMN: card shortcut
  // =========================================

  // Match the row's PP / OS with an event of the sheet date
  function linkRow(i) {

    const kind = field(i, 'kind').value;
    const num = field(i, 'number').value.trim();

    if (!num) {
      rowEvents[i] = null;
    } else {
      const live = dayEvents.find(ev => ev.number === num && ev.kind === kind);
      const kept = rowEvents[i];
      if (live) {
        rowEvents[i] = snapshot(live);
      } else if (!(kept && kept.kind === kind && kept.number === num && kept.date === sheetIsoDate())) {
        rowEvents[i] = null;
      }
    }

    renderCardCell(i);

  }


  function linkAllRows() {
    for (let i = 0; i < ROWS; i++) linkRow(i);
  }


  function renderCardCell(i) {

    const cell = $('card-' + i);
    const ev = rowEvents[i];
    const num = field(i, 'number').value.trim();

    if (ev) {
      cell.innerHTML = `
        <button type="button" class="card-link" data-card="${i}" style="--c:${safeHex(ev.colorHex)}" title="Open details">
          <span class="cl-time">${escapeHtml(timeLabel(ev))}</span>
          <span class="cl-title">${escapeHtml(ev.title)}</span>
          ${ev.location ? `<span class="cl-loc">${escapeHtml(ev.location)}</span>` : ''}
        </button>`;
    } else if (num) {
      cell.innerHTML = '<span class="no-event">No calendar event for this PP / OS</span>';
    } else {
      cell.innerHTML = '';
    }

  }


  function openCard(i) {

    const ev = rowEvents[i];
    if (!ev) return;

    const [y, m, d] = (ev.date || '').split('-').map(Number);
    const dateText = y
      ? `${WEEKDAYS[(new Date(y, m - 1, d).getDay() + 6) % 7]} ${ordinal(d)} ${MONTHS[m - 1]} ${y}`
      : '';

    $('cm-box').style.setProperty('--c', safeHex(ev.colorHex));
    $('cm-color').textContent = ev.colorName || '';
    $('cm-ref').textContent = `${ev.kind} ${ev.number}`;
    $('cm-when').textContent = [dateText, timeLabel(ev)].filter(Boolean).join(' · ');
    $('cm-title').textContent = ev.title || '';

    $('cm-loc-block').classList.toggle('hidden', !ev.location);
    $('cm-loc').textContent = ev.location || '';
    $('cm-map').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(ev.location || '');

    const desc = descriptionText(ev.description);
    $('cm-desc-block').classList.toggle('hidden', !desc);
    $('cm-desc').innerHTML = linkify(escapeHtml(desc));

    $('card-modal').classList.remove('hidden');
    $('cm-close').focus();

  }


  function closeCard() {
    $('card-modal').classList.add('hidden');
  }


  // =========================================
  // GOOGLE CALENDAR PANEL (one list per colour)
  // =========================================

  function renderCalendar(syncedAt) {

    const body = $('cal-body');

    if (syncedAt !== undefined) {
      $('cal-synced').textContent = syncedAt
        ? 'Calendar synced ' + new Date(syncedAt).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' })
        : 'Calendar never synced yet';
    }

    if (!calDate) {
      $('cal-summary').textContent = '– choose a date';
      body.innerHTML = '<div class="muted">Pick the date of the sheet to see that day\'s calendar events.</div>';
      return;
    }

    $('cal-summary').textContent =
      `– ${dayEvents.length} event${dayEvents.length === 1 ? '' : 's'} on this day` +
      (hiddenCount ? ` (${hiddenCount} ignored)` : '');

    if (!dayEvents.length) {
      body.innerHTML = '<div class="muted">No calendar events for this day.</div>';
      return;
    }

    // group by colour
    const groups = new Map();

    dayEvents.forEach((ev, idx) => {
      const c = colorOf(ev);
      const key = c.name;
      if (!groups.has(key)) groups.set(key, { ...c, items: [] });
      groups.get(key).items.push(idx);
    });

    const rank = g => {
      const r = GROUP_ORDER.indexOf(g.name);
      return r === -1 ? GROUP_ORDER.length : r;
    };

    const sorted = [...groups.values()].sort((a, b) => rank(a) - rank(b) || b.items.length - a.items.length);

    const onSheet = numbersOnSheet();

    body.innerHTML = '<div class="cal-groups">' + sorted.map((g, gi) => `
      <section class="cal-group" style="--c:${safeHex(g.hex)}">
        <div class="cal-group-head">
          <span class="dot"></span>
          <strong>${escapeHtml(g.name)}</strong>
          <small>${g.items.length} event${g.items.length === 1 ? '' : 's'}</small>
          <button type="button" class="small" data-select-group="${gi}">Select all</button>
        </div>
        <ul data-group="${gi}">
          ${g.items.map(idx => {
            const ev = dayEvents[idx];
            const added = ev.number && onSheet.has(ev.kind + ':' + ev.number);
            const ref = added
              ? '<span class="ref">on sheet</span>'
              : ev.number
                ? `<span class="ref">${escapeHtml(ev.kind)} ${escapeHtml(ev.number)}</span>`
                : '<span class="ref none">no PP/OS</span>';
            return `
              <li class="${added ? 'added' : ''} ${ev.number ? '' : 'noref'}">
                <label>
                  <input type="checkbox" data-cal="${idx}" ${(added || !ev.number) ? 'disabled' : ''} aria-label="Select event">
                  <span>
                    <span class="ev-time">${escapeHtml(timeLabel(ev))}</span>
                    ${escapeHtml(ev.title)}
                    ${ev.location ? `<span class="ev-loc">${escapeHtml(ev.location)}</span>` : ''}
                  </span>
                  ${ref}
                </label>
              </li>`;
          }).join('')}
        </ul>
      </section>`).join('') + '</div>';

  }


  async function loadCalendar() {

    calDate = sheetIsoDate();

    if (!calDate) {
      dayEvents = [];
      hiddenCount = 0;
      renderCalendar();
      linkAllRows();
      return;
    }

    const asked = calDate;

    try {

      const data = await api('/api/calendar?date=' + asked);

      if (asked !== calDate) return;   // date changed meanwhile

      calColor = data.calendarColor || '';

      const all = data.events || [];
      dayEvents = all.filter(ev => !isIgnored(ev));
      hiddenCount = all.length - dayEvents.length;

      renderCalendar(data.syncedAt);
      linkAllRows();

    } catch (err) {

      $('cal-body').innerHTML = '<div class="muted">Could not load calendar events.</div>';

    }

  }


  function addSelectedToSheet() {

    const picked = [...document.querySelectorAll('#cal-body [data-cal]:checked')]
      .map(box => dayEvents[Number(box.dataset.cal)]);

    if (!picked.length) {
      setStatus('Tick at least one event', 'err');
      return;
    }

    const onSheet = numbersOnSheet();
    let placed = 0;
    let noRoom = 0;

    for (const ev of picked) {

      if (!ev.number || onSheet.has(ev.kind + ':' + ev.number)) continue;

      // first row with an empty number box
      let row = -1;
      for (let i = 0; i < ROWS; i++) {
        if (!field(i, 'number').value.trim()) { row = i; break; }
      }

      if (row === -1) { noRoom++; continue; }

      field(row, 'kind').value = ev.kind || 'PP';
      field(row, 'number').value = ev.number;
      linkRow(row);

      onSheet.add(ev.kind + ':' + ev.number);
      placed++;

    }

    renderCalendar();

    setStatus(
      `${placed} added from calendar` + (noRoom ? ` · ${noRoom} did not fit (sheet full)` : '') + ' – remember to Save',
      noRoom ? 'err' : 'ok'
    );

  }


  // =========================================
  // READ / WRITE FORM
  // =========================================

  let currentId = newId();

  function readForm() {

    const rows = [];

    for (let i = 0; i < ROWS; i++) {
      rows.push({
        kind: field(i, 'kind').value,
        number: field(i, 'number').value.trim(),
        timeIn: field(i, 'timeIn').value,
        timeOut: field(i, 'timeOut').value,
        event: rowEvents[i]
      });
    }

    const d = $('date-day').value;
    const m = $('date-month').value;
    const y = $('date-year').value;

    return {
      date: {
        day: d,
        month: m,
        year: y,
        text: (d && m && y) ? `${ordinal(Number(d))} ${MONTHS[m - 1]} ${y}` : ''
      },
      day: $('weekday').value,
      rows,
      signOut: $('sign-out').value.trim(),
      signIn: $('sign-in').value.trim()
    };

  }


  function writeForm(sheet) {

    const date = sheet.date || {};

    $('date-year').value = date.year || String(YEARS[0]);
    $('date-month').value = date.month || '';
    refreshDays();
    $('date-day').value = date.day || '';

    $('weekday').value = sheet.day || '';

    const rows = sheet.rows || [];

    for (let i = 0; i < ROWS; i++) {
      const row = rows[i] || {};
      field(i, 'kind').value = row.kind || 'PP';
      field(i, 'number').value = row.number || '';
      field(i, 'timeIn').value = row.timeIn || '';
      field(i, 'timeOut').value = row.timeOut || '';
      rowEvents[i] = row.event || null;
      renderCardCell(i);
    }

    $('sign-out').value = sheet.signOut || '';
    $('sign-in').value = sheet.signIn || '';

  }


  // =========================================
  // API
  // =========================================

  let userName = safeGet(NAME_KEY);

  async function api(path, options = {}) {

    const res = await fetch(path, {
      ...options,
      headers: {
        'content-type': 'application/json',
        'x-user-name': encodeURIComponent(userName),
        ...(options.headers || {})
      }
    });

    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);

    return res.json();

  }


  async function loadList() {

    try {

      const list = await api('/api/sheets');

      $('saved-count').textContent = list.length;

      $('saved-list').innerHTML = list.map(s => `
        <li>
          <span>
            <strong>${escapeHtml(s.date?.text || 'No date')}</strong>
            ${s.day ? '· ' + escapeHtml(s.day) : ''}
            <br><small>Last saved by ${escapeHtml(s.updatedBy)} · ${new Date(s.updatedAt).toLocaleString('en-GB')}</small>
          </span>
          <button type="button" data-open="${escapeHtml(s.id)}">Open</button>
          <button type="button" class="danger" data-delete="${escapeHtml(s.id)}">Delete</button>
        </li>`).join('') || '<li><span><small>No saved sheets yet.</small></span></li>';

    } catch (err) {

      setStatus('Could not load list', 'err');

    }

  }


  async function save() {

    setStatus('Saving…');

    try {

      await api('/api/sheets/' + currentId, {
        method: 'PUT',
        body: JSON.stringify(readForm())
      });

      setStatus('Saved ' + new Date().toLocaleTimeString('en-GB'), 'ok');

      loadList();

    } catch (err) {

      setStatus('Save failed: ' + err.message, 'err');

    }

  }


  async function openSheet(id) {

    try {

      const sheet = await api('/api/sheets/' + id);

      currentId = sheet.id;

      writeForm(sheet);

      loadCalendar();

      setStatus('Opened', 'ok');

      window.scrollTo({ top: 0, behavior: 'smooth' });

    } catch (err) {

      setStatus('Open failed', 'err');

    }

  }


  async function deleteSheet(id) {

    if (!confirm('Delete this sheet?')) return;

    try {

      await api('/api/sheets/' + id, { method: 'DELETE' });

      if (id === currentId) newSheet();

      loadList();

    } catch (err) {

      setStatus('Delete failed', 'err');

    }

  }


  function newSheet() {

    currentId = newId();

    writeForm({});

    loadCalendar();

    setStatus('');

  }


  // =========================================
  // NAME GATE
  // =========================================

  function showGate() {

    $('gate').classList.remove('hidden');
    $('gate-name').value = userName;
    $('gate-name').focus();

  }


  async function enter(name) {

    userName = name;

    safeSet(NAME_KEY, name);

    $('who').innerHTML = `${escapeHtml(name)} <small>signed in</small>`;

    $('gate').classList.add('hidden');

    try { await api('/api/hello', { method: 'POST' }); } catch {}

    loadList();

    if (sheetIsoDate()) loadCalendar();

  }


  // =========================================
  // EVENTS
  // =========================================

  $('gate-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('gate-name').value.trim();
    if (name) enter(name);
  });

  $('change-user').addEventListener('click', showGate);

  $('date-month').addEventListener('change', () => { refreshDays(); suggestWeekday(); loadCalendar(); });
  $('date-year').addEventListener('change', () => { refreshDays(); suggestWeekday(); loadCalendar(); });
  $('date-day').addEventListener('change', () => { suggestWeekday(); loadCalendar(); });

  $('btn-save').addEventListener('click', save);
  $('btn-new').addEventListener('click', () => {
    if (confirm('Start a new blank sheet? Unsaved changes will be lost.')) newSheet();
  });
  $('btn-print').addEventListener('click', () => window.print());

  $('saved-list').addEventListener('click', e => {
    const open = e.target.closest('[data-open]');
    const del = e.target.closest('[data-delete]');
    if (open) openSheet(open.dataset.open);
    if (del) deleteSheet(del.dataset.delete);
  });

  // calendar panel
  $('cal-refresh').addEventListener('click', loadCalendar);
  $('cal-add').addEventListener('click', addSelectedToSheet);
  $('cal-body').addEventListener('click', e => {
    const btn = e.target.closest('[data-select-group]');
    if (!btn) return;
    document
      .querySelectorAll(`#cal-body ul[data-group="${btn.dataset.selectGroup}"] [data-cal]:not(:disabled)`)
      .forEach(box => { box.checked = true; });
  });

  // rows: PP / OS typed or changed -> relink the card
  function onRowEdit(e) {
    const t = e.target;
    if (t.dataset.field !== 'number' && t.dataset.field !== 'kind') return;
    linkRow(Number(t.dataset.row));
    if (calDate) renderCalendar();
  }

  $('rows').addEventListener('input', onRowEdit);
  $('rows').addEventListener('change', onRowEdit);

  $('rows').addEventListener('click', e => {
    const card = e.target.closest('[data-card]');
    if (card) openCard(Number(card.dataset.card));
  });

  // card modal
  $('cm-close').addEventListener('click', closeCard);
  $('card-modal').addEventListener('click', e => { if (e.target === $('card-modal')) closeCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });


  // =========================================
  // INIT
  // =========================================

  buildHeader();
  buildRows();

  // Name is asked on every page load (pre-filled with the last one used)
  showGate();

})();
</script>
</body>
</html>
