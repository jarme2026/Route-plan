<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>route plan</title>
<style>
  :root {
    --ink: #1d1d1f;
    --line: #2b2b2b;
    --muted: #6b6b6b;
    --bg: #eef0f3;
    --paper: #ffffff;
    --accent: #1f5fbf;
    --ok: #1e8a4c;
    --danger: #c0392b;
    --warn-bg: #fff4e5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  .hidden { display: none !important; }

  /* admin-only / team-only pieces */
  body.role-basic .admin-only { display: none !important; }
  body.role-admin .basic-only { display: none !important; }

  /* ---------- OVERLAYS (name gate, event card, answers) ---------- */

  #gate, .modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 24, 31, .75);
    z-index: 50;
    padding: 16px;
  }

  .gate-card {
    background: var(--paper);
    border-radius: 12px;
    padding: 28px 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
  }

  .gate-card h1 { margin: 0 0 6px; font-size: 22px; }
  .gate-card p { margin: 0 0 18px; color: var(--muted); }

  .gate-card input[type=text],
  .gate-card input[type=password] {
    width: 100%;
    font-size: 17px;
    padding: 10px 12px;
    border: 1px solid #bbb;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  .gate-card .check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 14px;
    font-size: 15px;
    cursor: pointer;
  }

  .gate-card .check input { width: 18px; height: 18px; }

  .gate-error { color: var(--danger); font-size: 14px; margin: -6px 0 12px; }

  /* ---------- TOOLBAR ---------- */

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #d5d8dd;
  }

  .toolbar .user { font-weight: 600; margin-right: auto; display: flex; align-items: center; gap: 6px; }

  .role-badge {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 2px 8px;
    border-radius: 99px;
    background: #e8eefb;
    color: var(--accent);
  }

  body.role-admin .role-badge { background: #fdeee7; color: #b3471c; }

  button, .btn {
    font: inherit;
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #c4c8ce;
    background: #fff;
    cursor: pointer;
    color: var(--ink);
  }

  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button.link { border: 0; background: none; color: var(--accent); padding: 0 4px; }
  button.small { font-size: 13px; padding: 5px 10px; }
  button:disabled { opacity: .5; cursor: default; }

  #status { font-size: 14px; color: var(--muted); min-width: 120px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--danger); }

  /* ---------- SHEET LIST ---------- */

  .panel {
    max-width: 820px;
    margin: 12px auto 0;
    padding: 0 16px;
  }

  .panel > details {
    background: #fff;
    border: 1px solid #d5d8dd;
    border-radius: 8px;
    padding: 8px 12px;
  }

  .panel summary { cursor: pointer; font-weight: 600; }

  #saved-list { list-style: none; padding: 0; margin: 8px 0 0; }

  #saved-list li {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 0;
    border-top: 1px solid #eee;
    font-size: 14px;
  }

  #saved-list li span.info { flex: 1; min-width: 0; }
  #saved-list li small { color: var(--muted); }
  #saved-list li.current { background: #f4f8ff; }

  .pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 99px;
    background: #eef0f3;
    color: var(--muted);
    white-space: nowrap;
  }

  .pill.closed { background: #fdecea; color: var(--danger); }
  .pill.done { background: #e7f5ec; color: var(--ok); }

  /* ---------- PAPER ---------- */

  .paper {
    background: var(--paper);
    max-width: 820px;
    margin: 12px auto 24px;
    padding: 22px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
  }

  .closed-banner {
    background: #fdecea;
    color: var(--danger);
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 16px;
  }

  .sheet { border: 2px solid var(--line); }

  .head {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 24px;
    padding: 12px 14px;
    border-bottom: 2px solid var(--line);
  }

  .field label, .label {
    display: block;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 4px;
  }

  .ro-value { font-size: 18px; padding: 6px 0; border-bottom: 2px solid var(--line); min-height: 36px; }

  .date-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .date-row .sep { font-weight: 700; font-size: 18px; }

  select, input[type=text] {
    font: inherit;
    font-size: 16px;
    padding: 6px 8px;
    border: 0;
    border-bottom: 2px solid var(--line);
    background: transparent;
    border-radius: 0;
    min-width: 0;
    color: var(--ink);
  }

  select:focus, input[type=text]:focus {
    outline: none;
    border-bottom-color: var(--accent);
    background: #f4f8ff;
  }

  select:disabled, input:disabled { color: var(--ink); opacity: 1; }

  .wide { width: 100%; }

  /* ---------- ROUTE BAR ---------- */

  .route-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 10px 14px;
    border-bottom: 2px solid var(--line);
    border-left: 10px solid var(--route, transparent);
  }

  .route-bar label, .route-bar .label { font-weight: 700; font-size: 17px; margin: 0; }

  #route { font-weight: 700; min-width: 190px; }

  #route-name { font-weight: 700; font-size: 17px; }

  .route-bar small { color: var(--muted); margin-left: auto; }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--c, #999);
    flex: 0 0 auto;
    display: inline-block;
    vertical-align: middle;
  }

  /* ---------- DELIVERIES ---------- */

  table.deliveries {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  table.deliveries th,
  table.deliveries td {
    border: 2px solid var(--line);
    padding: 4px 6px;
  }

  table.deliveries tr > :first-child { border-left: 0; }
  table.deliveries tr > :last-child { border-right: 0; }
  table.deliveries tr:last-child td { border-bottom: 0; }
  table.deliveries thead th { border-top: 0; }

  table.deliveries th { font-size: 20px; font-weight: 700; }

  table.deliveries td { height: 60px; vertical-align: middle; }

  col.c-card { width: 40%; }
  col.c-pp { width: 30%; }

  .pick { width: 100%; font-weight: 700; }

  .manual {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-top: 4px;
  }

  .manual select { flex: 0 0 auto; font-weight: 700; }
  .manual input { flex: 1; width: 100%; }

  .ro-ref { font-weight: 700; font-size: 15px; }

  .refs-line { display: block; font-size: 13px; font-weight: 700; margin-top: 3px; }
  .refs-line:empty { display: none; }

  .print-ref { display: none; font-weight: 700; }

  .dur { width: 100%; font-weight: 700; }
  .dur.set { background: #eef8f1; }

  .dur-by { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; min-height: 14px; }
  .dur-by.saved { color: var(--ok); }

  .m-label { display: none; }

  /* shortcut card in the first column */
  .card-link {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 13px;
    line-height: 1.25;
    padding: 4px 8px;
    border: 1px solid #d5d8dd;
    border-left: 6px solid var(--c, #999);
    border-radius: 6px;
    background: #fafbfc;
  }

  .card-link:hover { background: #f1f5fb; }

  .card-link .cl-time { font-weight: 700; }
  .card-link .cl-title,
  .card-link .cl-loc {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-link .cl-loc { color: var(--muted); }

  .no-event { font-size: 13px; color: var(--muted); font-style: italic; }

  /* team view: only rows with a delivery */
  body.role-basic table.deliveries tr.empty { display: none; }

  .sign {
    padding: 22px 14px 6px;
    display: grid;
    gap: 16px;
    max-width: 420px;
    margin: 0 auto;
  }

  .sign input { width: 100%; }

  /* ---------- CARD / ANSWERS (modal boxes) ---------- */

  .card-box, .answers-box {
    background: var(--paper);
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow: auto;
    border-radius: 12px;
    border-top: 10px solid var(--c, #999);
    padding: 16px 20px 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
  }

  .answers-box { max-width: 720px; border-top-color: var(--accent); }

  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-top .chip { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin-right: auto; }

  .cm-ref { font-size: 22px; font-weight: 700; margin: 8px 0 2px; }
  .cm-when { color: var(--muted); font-size: 15px; }
  .card-box h2 { font-size: 19px; margin: 12px 0; }

  .cm-block { border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
  .cm-block .label { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .cm-desc { white-space: pre-wrap; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
  .card-box a { color: var(--accent); }

  .answers-box h2 { font-size: 20px; margin: 0 auto 0 0; }
  .answers-sub { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }

  .ans-item { border-top: 1px solid #eee; padding: 10px 0; }
  .ans-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .ans-head strong { flex: 1; min-width: 200px; }
  .ans-final { font-weight: 700; white-space: nowrap; }
  .ans-final.none { color: var(--danger); font-weight: 400; }
  .ans-hist { list-style: none; margin: 6px 0 0; padding: 0 0 0 12px; border-left: 3px solid #e3e5e9; font-size: 13px; color: var(--muted); }
  .ans-hist li { padding: 1px 0; }

  /* ---------- MOBILE: one block per delivery ---------- */

  @media (max-width: 640px) {

    .toolbar { padding: 8px 10px; gap: 6px; }
    .toolbar .user { flex: 1 0 100%; }
    .toolbar #status { order: 5; flex: 1 0 100%; min-width: 0; }
    .toolbar > button { flex: 1; padding: 8px 6px; }

    .panel { padding: 0 8px; }

    .paper { padding: 0; margin: 8px 8px 24px; }
    .closed-banner { margin: 8px; }

    .sheet { border-width: 0; }

    .head { grid-template-columns: 1fr; gap: 10px; padding: 12px; }
    .date-row { flex-wrap: nowrap; }
    .date-row select { flex: 1; }
    .date-row #date-month { flex: 2; }

    select, input[type=text] { font-size: 16px; }   /* 16px avoids iOS zoom */

    .route-bar { padding: 10px 12px; }
    #route { flex: 1; min-width: 0; }
    .route-bar small { margin-left: 0; flex: 1 0 100%; }

    table.deliveries, table.deliveries tbody { display: block; }
    table.deliveries thead, table.deliveries colgroup { display: none; }

    table.deliveries tbody { counter-reset: row; }

    table.deliveries tr {
      counter-increment: row;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 8px 10px;
      padding: 12px;
      border-bottom: 1px solid #d5d8dd;
    }

    table.deliveries tr::before {
      content: counter(row);
      grid-row: 1;
      align-self: start;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #eef0f3;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    table.deliveries td {
      display: block;
      border: 0 !important;
      height: auto;
      padding: 0;
      grid-column: 2;
      min-width: 0;
    }

    td.c-pp { order: 1; }
    td.c-card { order: 2; }
    td.c-times { order: 3; }

    td.c-card:empty { display: none; }

    .m-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }

    .dur { font-size: 17px; padding: 8px; border: 1px solid #c4c8ce; border-radius: 8px; }

    .card-link { font-size: 14px; padding: 6px 10px; }

    /* admin: only filled rows + the next empty one */
    body.role-admin table.deliveries tr.empty:not(.next) { display: none; }

    .sign { padding: 16px 12px; }

    .modal { align-items: flex-end; padding: 0; }
    .card-box, .answers-box { max-width: none; border-radius: 14px 14px 0 0; max-height: 88vh; }
  }

  /* ---------- PRINT (A4, like the paper form) ---------- */

  @media print {
    @page { size: A4; margin: 12mm; }

    body { background: #fff; }

    .toolbar, .panel, #gate, .modal, .route-bar small, .route-bar button, .closed-banner { display: none !important; }

    .paper { box-shadow: none; margin: 0; padding: 0; max-width: none; }

    select {
      -webkit-appearance: none;
      appearance: none;
      background: none;
    }

    select, input[type=text] { border-bottom-color: transparent; }

    .head select, .sign input { border-bottom-color: var(--line); }

    .pick, .manual, .refs-line, .dur-by { display: none !important; }
    .print-ref { display: inline; }
    .dur.set { background: none; }

    .card-link { border: 0; background: none; padding: 0; }
    .no-event { display: none; }

    table.deliveries td { height: 64px; }
  }
</style>
</head>
<body class="role-basic">

<!-- ================= NAME GATE ================= -->
<form id="gate">
  <div class="gate-card">
    <h1>route plan</h1>
    <p>Please enter your name to continue.</p>
    <input id="gate-name" type="text" autocomplete="name" placeholder="Your name" maxlength="60" required>
    <label class="check"><input type="checkbox" id="gate-admin"> I'm the admin</label>
    <input id="gate-pass" type="password" class="hidden" placeholder="Admin password" autocomplete="current-password">
    <div class="gate-error hidden" id="gate-error"></div>
    <button class="primary wide" type="submit" id="gate-enter">Enter</button>
  </div>
</form>

<!-- ================= EVENT CARD ================= -->
<div id="card-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cm-title">
  <div class="card-box" id="cm-box">
    <div class="card-top">
      <span class="chip"><span class="dot"></span><span id="cm-color"></span></span>
      <button type="button" class="small" data-close aria-label="Close">Close</button>
    </div>
    <div class="cm-ref" id="cm-ref"></div>
    <div class="cm-when" id="cm-when"></div>
    <h2 id="cm-title"></h2>
    <div class="cm-block" id="cm-loc-block">
      <span class="label">Address</span>
      <div id="cm-loc"></div>
      <a id="cm-map" target="_blank" rel="noopener">Open in Google Maps</a>
    </div>
    <div class="cm-block" id="cm-desc-block">
      <span class="label">Event details</span>
      <div class="cm-desc" id="cm-desc"></div>
    </div>
  </div>
</div>

<!-- ================= ANSWERS (admin) ================= -->
<div id="answers-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="ans-title">
  <div class="answers-box">
    <div class="card-top">
      <h2 id="ans-title">Delivery duration answers</h2>
      <button type="button" class="small" id="ans-csv">Download CSV</button>
      <button type="button" class="small" data-close aria-label="Close">Close</button>
    </div>
    <div class="answers-sub" id="ans-sub"></div>
    <div id="ans-body"></div>
  </div>
</div>

<!-- ================= TOOLBAR ================= -->
<div class="toolbar">
  <div class="user">
    <span id="who"></span>
    <span class="role-badge" id="role-badge">Team</span>
    <button class="link" id="change-user" type="button">change</button>
  </div>
  <span id="status"></span>
  <button type="button" class="admin-only" id="btn-new">New</button>
  <button type="button" class="admin-only primary" id="btn-save">Save</button>
  <button type="button" class="admin-only" id="btn-answers">Answers</button>
  <button type="button" class="admin-only" id="btn-close">Close day</button>
  <button type="button" class="basic-only" id="btn-reload">Refresh</button>
  <button type="button" id="btn-print">Print</button>
</div>

<!-- ================= SHEETS ================= -->
<div class="panel" id="saved">
  <details id="saved-box">
    <summary>Sheets (<span id="saved-count">0</span>)</summary>
    <ul id="saved-list"></ul>
  </details>
</div>

<!-- ================= SHEET ================= -->
<main class="paper">

  <div class="closed-banner hidden" id="closed-banner"></div>

  <div class="empty-state hidden" id="empty-state">Open a sheet from the list above.</div>

  <div id="sheet-wrap">
  <div class="sheet">

    <div class="head">

      <div class="field">
        <span class="label">Date:</span>
        <div class="date-row admin-only">
          <select id="date-day" aria-label="Day of month"></select>
          <span class="sep">/</span>
          <select id="date-month" aria-label="Month"></select>
          <span class="sep">/</span>
          <select id="date-year" aria-label="Year"></select>
        </div>
        <div class="ro-value basic-only" id="ro-date"></div>
      </div>

      <div class="field">
        <label for="weekday">Day:</label>
        <select id="weekday" class="wide admin-only"></select>
        <div class="ro-value basic-only" id="ro-day"></div>
      </div>

    </div>

    <div class="route-bar" id="route-bar">
      <span class="label">Route:</span>
      <select id="route" class="admin-only" aria-label="Route"><option value="">Choose the date first</option></select>
      <span id="route-name" class="basic-only"></span>
      <button type="button" class="small admin-only" id="route-fill" title="Put every event of this route on the sheet">Fill all</button>
      <button type="button" class="small admin-only" id="route-refresh" title="Reload the calendar">Refresh</button>
      <small id="cal-synced" class="admin-only"></small>
    </div>

    <table class="deliveries">
      <colgroup>
        <col class="c-card"><col class="c-pp"><col>
      </colgroup>
      <thead>
        <tr>
          <th>Delivery</th>
          <th>PP / OS</th>
          <th>Delivery duration</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

  </div>

  <div class="sign">
    <div class="field">
      <label for="sign-out">Sign out:</label>
      <input id="sign-out" type="text">
    </div>
    <div class="field">
      <label for="sign-in">Sign In:</label>
      <input id="sign-in" type="text">
    </div>
  </div>
  </div>

</main>

<script>
(() => {

  // =========================================
  // CONSTANTS
  // =========================================

  const ROWS = 9;

  const MONTHS = [
    'January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'
  ];

  const WEEKDAYS = [
    'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'
  ];

  const YEARS = [2026, 2027];

  // 30 minutes -> 6 hours, every 15 minutes
  const DURATIONS = [];

  for (let m = 30; m <= 360; m += 15) {
    DURATIONS.push(m);
  }

  // Google Calendar event colours (colour id -> name, hex)
  const EVENT_COLORS = {
    '1': ['Lavender', '#7986cb'],
    '2': ['Sage', '#33b679'],
    '3': ['Grape', '#8e24aa'],
    '4': ['Flamingo', '#e67c73'],
    '5': ['Yellow', '#f6bf26'],
    '6': ['Orange', '#f4511e'],
    '7': ['Blue', '#039be5'],
    '8': ['Grey', '#616161'],
    '9': ['Dark blue', '#3f51b5'],
    '10': ['Green', '#0b8043'],
    '11': ['Red', '#d50000']
  };

  // Routes listed first, in this order (any other colour comes after)
  const ROUTE_ORDER = ['Orange', 'Blue'];

  const MANUAL = '__manual';

  const NAME_KEY = 'route-plan:name';
  const TOKEN_KEY = 'route-plan:admin-token';

  const $ = id => document.getElementById(id);

  const field = (i, f) => document.querySelector(`[data-row="${i}"][data-field="${f}"]`);


  // =========================================
  // HELPERS
  // =========================================

  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function durationLabel(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    const parts = [];
    if (h) parts.push(h + (h === 1 ? ' hour' : ' hours'));
    if (m) parts.push(m + ' minutes');
    return parts.join(' ');
  }

  function shortTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const today = new Date().toDateString() === d.toDateString();
    return today
      ? d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
  }

  function fillSelect(select, options, placeholder) {
    select.innerHTML = '';
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = placeholder;
    select.appendChild(empty);
    for (const [value, label] of options) {
      const opt = document.createElement('option');
      opt.value = String(value);
      opt.textContent = label;
      select.appendChild(opt);
    }
  }

  function safeGet(key) {
    try { return localStorage.getItem(key) || ''; } catch { return ''; }
  }

  function safeSet(key, value) {
    try {
      if (value) localStorage.setItem(key, value);
      else localStorage.removeItem(key);
    } catch {}
  }

  function newId() {
    return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  }

  function setStatus(text, kind = '') {
    const el = $('status');
    el.textContent = text;
    el.className = kind;
  }

  function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function safeHex(hex) {
    return /^#[0-9a-f]{6}$/i.test(hex || '') ? hex : '#9e9e9e';
  }

  // Name for a colour that is not one of Google's event colours
  function hueName(hex) {
    const n = parseInt(safeHex(hex).slice(1), 16);
    const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if (d < 0.12) return 'Grey';
    let h;
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
    if (h < 12 || h >= 340) return 'Red';
    if (h < 45) return 'Orange';
    if (h < 70) return 'Yellow';
    if (h < 170) return 'Green';
    if (h < 260) return 'Blue';
    return 'Purple';
  }

  // Google Calendar descriptions may contain simple HTML -> plain text
  function descriptionText(html) {
    if (!html) return '';
    const withBreaks = String(html)
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(p|div|li)>/gi, '\n');
    const doc = new DOMParser().parseFromString(withBreaks, 'text/html');
    return (doc.body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  }

  function linkify(escaped) {
    return escaped.replace(/https?:\/\/[^\s<]+/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  }

  function timeLabel(ev) {
    return ev.allDay ? 'All day' : `${ev.start}–${ev.end}`;
  }

  // Text for the dropdown: "10:00 · D04 pp26159 os49481 (4876) BALDue"
  function optionLabel(ev) {
    const time = ev.allDay ? 'All day' : ev.start;
    const t = (ev.title || '').replace(/\s+/g, ' ').trim();
    return `${time} · ${t.length > 44 ? t.slice(0, 43) + '…' : t}`;
  }

  // Every PP / OS in the title + description: "pp26347 pp26352 os49917"
  function parseRefs(text) {
    const refs = [];
    const re = /\b(PP|OS)\s*[-:#.]?\s*(\d{3,})/gi;
    let m;
    while ((m = re.exec(text || ''))) {
      const ref = { kind: m[1].toUpperCase(), number: m[2] };
      if (!refs.some(r => r.kind === ref.kind && r.number === ref.number)) refs.push(ref);
    }
    return refs;
  }

  // "PP 26347, 26352 · OS 49917, 49976"
  function refsText(refs) {
    return ['PP', 'OS']
      .map(k => {
        const nums = (refs || []).filter(r => r.kind === k).map(r => r.number);
        return nums.length ? `${k} ${nums.join(', ')}` : '';
      })
      .filter(Boolean)
      .join(' · ');
  }

  // Add refs (all PP / OS) and main kind / number to a calendar event
  function prepareEvent(ev) {
    const refs = parseRefs((ev.title || '') + '\n' + descriptionText(ev.description));
    const first = refs[0];
    return {
      ...ev,
      refs,
      kind: first ? first.kind : (ev.kind || ''),
      number: first ? first.number : (ev.number || '')
    };
  }

  // Unique key of an event: its PP / OS, or time + title when it has none
  function evKey(ev) {
    return ev.number ? ev.kind + ':' + ev.number : 'T:' + (ev.start || '') + '|' + (ev.title || '');
  }

  // Text of a sheet row: PP / OS list, or the event title
  function rowRefText(row) {
    if (row.event && row.event.refs && row.event.refs.length) return refsText(row.event.refs);
    if (row.number) return `${row.kind} ${row.number}`;
    return row.event ? '—' : '';
  }


  // =========================================
  // STATE
  // =========================================

  let userName = safeGet(NAME_KEY);
  let adminToken = safeGet(TOKEN_KEY);
  let isAdmin = false;

  let currentId = newId();
  let sheetSaved = false;          // current sheet exists on the server
  let sheetStatus = 'open';        // open | closed
  let sheetInfo = {};              // closedBy / closedAt / updatedAt
  let savedKeys = new Set();       // delivery keys as last saved (durations need them)

  let calDate = '';
  let calColor = '';               // default colour of the calendar
  let syncedAt = null;
  let dayEvents = [];              // events of the sheet date (already filtered)
  let routes = [];                 // [{ name, hex, events: [...] }]
  let currentRoute = '';           // route name (colour)
  let routeHex = '';

  let rowEvents = new Array(ROWS).fill(null);    // event linked to each row
  let manualMode = new Array(ROWS).fill(false);  // row typed by hand
  let rowDur = new Array(ROWS).fill(null);       // { duration, durationBy, durationAt }
  let justSaved = new Array(ROWS).fill(false);

  let sheetList = [];


  // Events that never show: "1 van", "2 vans", no title, two-letter initials
  function isIgnored(ev) {
    const t = (ev.title || '').trim();
    if (!t || /^\(no title\)$/i.test(t)) return true;
    if (/^\d+\s*vans?$/i.test(t)) return true;
    if (/^\p{L}\.?\s*\p{L}\.?$/u.test(t)) return true;
    return false;
  }


  function colorOf(ev) {
    if (EVENT_COLORS[ev.colorId]) {
      const [name, hex] = EVENT_COLORS[ev.colorId];
      return { name, hex };
    }
    const hex = safeHex(calColor);
    return { name: hueName(hex), hex };
  }


  function sheetIsoDate() {

    const d = $('date-day').value;
    const m = $('date-month').value;
    const y = $('date-year').value;

    if (!d || !m || !y) return '';

    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

  }


  function todayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }


  function listIso(s) {
    const d = s.date || {};
    return d.year ? `${d.year}-${String(d.month).padStart(2, '0')}-${String(d.day).padStart(2, '0')}` : '';
  }


  function rowKey(i) {
    const num = field(i, 'number').value.trim();
    if (num) return field(i, 'kind').value + ':' + num;
    const ev = rowEvents[i];
    return (ev && !ev.number) ? evKey(ev) : '';
  }


  function snapshot(ev) {
    const c = colorOf(ev);
    return {
      date: ev.date, start: ev.start, end: ev.end, allDay: !!ev.allDay,
      title: ev.title, location: ev.location, description: ev.description || '',
      kind: ev.kind, number: ev.number, refs: ev.refs || [], colorName: c.name, colorHex: c.hex
    };
  }


  function buildRoutes() {

    const map = new Map();

    for (const ev of dayEvents) {
      const c = colorOf(ev);
      if (!map.has(c.name)) map.set(c.name, { ...c, events: [] });
      map.get(c.name).events.push(ev);
    }

    const rank = r => {
      const i = ROUTE_ORDER.indexOf(r.name);
      return i === -1 ? ROUTE_ORDER.length : i;
    };

    routes = [...map.values()].sort((a, b) => rank(a) - rank(b) || b.events.length - a.events.length);

  }


  function findEvent(kind, number) {
    return dayEvents.find(ev => ev.number === number && ev.kind === kind);
  }


  // =========================================
  // BUILD FORM
  // =========================================

  function buildHeader() {

    fillSelect($('date-month'), MONTHS.map((name, i) => [i + 1, name]), 'Month');

    fillSelect($('date-year'), YEARS.map(y => [y, String(y)]), 'Year');

    fillSelect($('weekday'), WEEKDAYS.map(d => [d, d]), 'Select day');

  // Day-of-month list follows the chosen month / year
  function refreshDays() {

    const select = $('date-day');
    const current = select.value;
    const month = Number($('date-month').value);
    const year = Number($('date-year').value) || YEARS[0];
    const max = month ? new Date(year, month, 0).getDate() : 31;

    const days = [];
    for (let d = 1; d <= max; d++) days.push([d, ordinal(d)]);

    fillSelect(select, days, 'Day');

    if (current && Number(current) <= max) select.value = current;

  }


  // Suggest the weekday from the chosen date (still editable)
  function suggestWeekday() {

    const d = Number($('date-day').value);
    const m = Number($('date-month').value);
    const y = Number($('date-year').value);

    if (!d || !m || !y) return;

    const js = new Date(y, m - 1, d).getDay();
    $('weekday').value = WEEKDAYS[(js + 6) % 7];

  }

  // =========================================
  // ROLE
  // =========================================

  function applyRole() {

    document.body.classList.toggle('role-admin', isAdmin);
    document.body.classList.toggle('role-basic', !isAdmin);

    $('role-badge').textContent = isAdmin ? 'Admin' : 'Team';

    applyLock();

  }


  // what can be edited right now
  function applyLock() {

    const closed = sheetStatus === 'closed';
    const adminEdit = isAdmin && !closed;

    for (const id of ['date-day', 'date-month', 'date-year', 'weekday', 'route', 'sign-out', 'sign-in']) {
      $(id).disabled = !adminEdit;
    }

    $('route-fill').disabled = !adminEdit || !routes.some(r => r.name === currentRoute);
    $('route-refresh').disabled = !adminEdit;
    $('btn-save').disabled = closed;

    document.querySelectorAll('[data-field=pick], [data-field=kind], [data-field=number]')
      .forEach(el => { el.disabled = !adminEdit; });

    document.querySelectorAll('[data-field=duration]')
      .forEach(el => { el.disabled = closed || !rowKey(Number(el.dataset.row)); });

    $('btn-close').textContent = closed ? 'Reopen day' : 'Close day';
    $('btn-close').disabled = !sheetSaved;
    $('btn-answers').disabled = !sheetSaved;

    const banner = $('closed-banner');
    banner.classList.toggle('hidden', !closed);
    banner.textContent = closed
      ? `Day closed by ${sheetInfo.closedBy || '?'} · ${shortTime(sheetInfo.closedAt)} – durations can't be changed`
      : '';

    // team member without a sheet opened
    const nothing = !isAdmin && !sheetSaved;
    $('sheet-wrap').classList.toggle('hidden', nothing);
    $('empty-state').classList.toggle('hidden', !nothing);

  }


  // =========================================
  // ROUTE DROPDOWN (admin)
  // =========================================

  function renderRoute() {

    const sel = $('route');

    if (!calDate) {
      sel.innerHTML = '<option value="">Choose the date first</option>';
    } else {
      const opts = routes.map(r =>
        `<option value="${escapeHtml(r.name)}">${escapeHtml(r.name)} – ${r.events.length} event${r.events.length === 1 ? '' : 's'}</option>`);
      // keep a saved route that has no events any more
      if (currentRoute && !routes.some(r => r.name === currentRoute)) {
        opts.push(`<option value="${escapeHtml(currentRoute)}">${escapeHtml(currentRoute)}</option>`);
      }
      sel.innerHTML =
        `<option value="">${routes.length ? 'Choose route' : 'No routes on this day'}</option>` + opts.join('');
    }

    sel.value = currentRoute;

    const r = routes.find(x => x.name === currentRoute);
    if (r) routeHex = r.hex;
    $('route-bar').style.setProperty('--route', currentRoute ? safeHex(routeHex) : 'transparent');

    $('route-name').textContent = currentRoute || '—';

    $('cal-synced').textContent = !calDate ? '' : syncedAt
      ? 'Calendar synced ' + new Date(syncedAt).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' })
      : 'Calendar never synced yet';

  }


  // =========================================
  // ROWS
  // =========================================

  function renderPick(i, used) {

    const sel = field(i, 'pick');
    const key = rowKey(i);
    const route = routes.find(r => r.name === currentRoute);

    const opts = [];
    const seen = new Set();

    for (const ev of (route ? route.events : [])) {
      const k = evKey(ev);
      seen.add(k);
      const taken = used.has(k) && k !== key;
      opts.push(`<option value="${escapeHtml(k)}" ${taken ? 'disabled' : ''}>${escapeHtml(optionLabel(ev))}${taken ? ' (on sheet)' : ''}</option>`);
    }

    // current value from another route / not in calendar any more
    if (key && !seen.has(key) && rowEvents[i]) {
      opts.unshift(`<option value="${escapeHtml(key)}">${escapeHtml(optionLabel(rowEvents[i]))}</option>`);
      seen.add(key);
    }

    const placeholder = !calDate ? 'Choose the date first'
      : !route ? 'Choose a route first'
      : 'Select PP / OS';

    sel.innerHTML =
      `<option value="">${placeholder}</option>` +
      opts.join('') +
      `<option value="${MANUAL}">Other – type number…</option>`;

    const manual = manualMode[i] || (key && !seen.has(key));
    manualMode[i] = !!manual;

    sel.value = manual ? MANUAL : key;

    $('manual-' + i).classList.toggle('hidden', !manual);

  }


  function renderRefs(i) {

    const num = field(i, 'number').value.trim();
    const linked = rowEvents[i];
    const text = rowRefText({ kind: field(i, 'kind').value, number: num, event: linked });

    $('refs-' + i).textContent = (linked && linked.refs && linked.refs.length > 1) ? refsText(linked.refs) : '';
    $('ro-ref-' + i).textContent = text;
    $('print-ref-' + i).textContent = text === '—' ? '' : text;

  }


  function renderCardCell(i) {

    const cell = $('card-' + i);
    const ev = rowEvents[i];
    const num = field(i, 'number').value.trim();

    if (ev) {
      cell.innerHTML = `
        <button type="button" class="card-link" data-card="${i}" style="--c:${safeHex(ev.colorHex)}" title="Open details">
          <span class="cl-time">${escapeHtml(timeLabel(ev))}</span>
          <span class="cl-title">${escapeHtml(ev.title)}</span>
          ${ev.location ? `<span class="cl-loc">${escapeHtml(ev.location)}</span>` : ''}
        </button>`;
    } else if (num) {
      cell.innerHTML = '<span class="no-event">No calendar event for this PP / OS</span>';
    } else {
      cell.innerHTML = '';
    }

  }


  function renderDuration(i) {

    const sel = field(i, 'duration');
    const d = rowDur[i];
    const key = rowKey(i);

    sel.value = d && d.duration ? String(d.duration) : '';
    sel.classList.toggle('set', !!(d && d.duration));

    const by = $('dur-by-' + i);
    by.classList.toggle('saved', justSaved[i]);

    if (!key) {
      by.textContent = '';
    } else if (justSaved[i]) {
      by.textContent = '✓ Saved';
    } else if (d && d.durationBy) {
      by.textContent = `${d.duration ? '' : 'Cleared · '}${d.durationBy} · ${shortTime(d.durationAt)}`;
    } else if (isAdmin && !savedKeys.has(key)) {
      by.textContent = 'Save the sheet to allow durations';
    } else {
      by.textContent = '';
    }

  }


  // mobile (admin) shows only the filled rows + the next empty one; team sees filled rows
  function markRows() {

    let nextSet = false;

    for (let i = 0; i < ROWS; i++) {
      const tr = $('row-' + i);
      const empty = !rowKey(i) && !manualMode[i];
      tr.classList.toggle('empty', empty);
      tr.classList.toggle('next', empty && !nextSet);
      if (empty) nextSet = true;
    }

  }


  function renderRows() {

    const used = new Set();
    for (let i = 0; i < ROWS; i++) {
      const k = rowKey(i);
      if (k) used.add(k);
    }

    for (let i = 0; i < ROWS; i++) {
      if (isAdmin) renderPick(i, used);
      renderRefs(i);
      renderCardCell(i);
      renderDuration(i);
    }

    markRows();
    applyLock();

  }


  // Match the row's PP / OS with an event of the sheet date
  function linkRow(i) {

    const kind = field(i, 'kind').value;
    const num = field(i, 'number').value.trim();

    if (!num) {
      const kept = rowEvents[i];
      if (kept && !kept.number && !manualMode[i] && kept.date === sheetIsoDate()) {
        const live = dayEvents.find(ev => evKey(ev) === evKey(kept));
        if (live) rowEvents[i] = snapshot(live);
      } else {
        rowEvents[i] = null;
      }
      return;
    }

    const live = findEvent(kind, num);
    const kept = rowEvents[i];

    if (live) {
      rowEvents[i] = snapshot(live);
    } else if (!(kept && kept.kind === kind && kept.number === num && kept.date === sheetIsoDate())) {
      rowEvents[i] = null;
    }

  }


  // row content changed (admin): the old duration no longer belongs to it
  function resetRowDuration(i) {
    rowDur[i] = null;
    justSaved[i] = false;
  }


  function onPick(i) {

    const value = field(i, 'pick').value;

    resetRowDuration(i);

    if (value === MANUAL) {
      manualMode[i] = true;
      field(i, 'number').value = '';
      rowEvents[i] = null;
      renderRows();
      field(i, 'number').focus();
      return;
    }

    manualMode[i] = false;

    if (!value) {
      field(i, 'kind').value = 'PP';
      field(i, 'number').value = '';
      rowEvents[i] = null;
    } else if (value.startsWith('T:')) {
      // event without PP / OS: link the event, leave the number empty
      const ev = dayEvents.find(x => evKey(x) === value);
      field(i, 'kind').value = 'PP';
      field(i, 'number').value = '';
      rowEvents[i] = ev ? snapshot(ev) : null;
    } else {
      const [kind, number] = value.split(':');
      field(i, 'kind').value = kind;
      field(i, 'number').value = number;
      linkRow(i);
    }

    renderRows();

  }


  function fillRoute() {

    const route = routes.find(r => r.name === currentRoute);
    if (!route) return;

    const used = new Set();
    for (let i = 0; i < ROWS; i++) {
      const k = rowKey(i);
      if (k) used.add(k);
    }

    let placed = 0;
    let noRoom = 0;

    for (const ev of route.events) {

      const k = evKey(ev);
      if (used.has(k)) continue;

      let row = -1;
      for (let i = 0; i < ROWS; i++) {
        if (!rowKey(i) && !manualMode[i]) { row = i; break; }
      }

      if (row === -1) { noRoom++; continue; }

      resetRowDuration(row);
      field(row, 'kind').value = ev.kind || 'PP';
      field(row, 'number').value = ev.number || '';
      if (ev.number) linkRow(row);
      else rowEvents[row] = snapshot(ev);
      used.add(k);
      placed++;

    }

    renderRows();

    setStatus(
      `${placed} added from ${currentRoute}` + (noRoom ? ` · ${noRoom} did not fit (sheet full)` : '') + ' – remember to Save',
      noRoom ? 'err' : 'ok'
    );

  }


  // =========================================
  // DELIVERY DURATION (everyone)
  // =========================================

  async function onDuration(i) {

    const sel = field(i, 'duration');
    const key = rowKey(i);
    const value = sel.value;

    if (!sheetSaved || !savedKeys.has(key)) {
      renderDuration(i);
      setStatus('Save the sheet first, then choose the duration', 'err');
      return;
    }

    sel.disabled = true;
    setStatus('Saving duration…');

    try {

      const res = await api(`/api/sheets/${currentId}/duration`, {
        method: 'POST',
        body: JSON.stringify({ key, minutes: value === '' ? null : Number(value) })
      });

      rowDur[i] = {
        duration: res.row.duration,
        durationBy: res.row.durationBy,
        durationAt: res.row.durationAt
      };

      // bring in any change made by the others since the page was opened
      await reloadCurrent(true);

      justSaved[i] = true;
      setTimeout(() => { justSaved[i] = false; renderDuration(i); }, 4000);

      setStatus('Duration saved ' + new Date().toLocaleTimeString('en-GB'), 'ok');

    } catch (err) {

      setStatus('Duration not saved: ' + err.message, 'err');
      if (/closed/i.test(err.message)) reloadCurrent(true);

    }

    sel.disabled = sheetStatus === 'closed';
    renderDuration(i);
    loadList();

  }


  // =========================================
  // CARD (modal)
  // =========================================

  function openCard(i) {

    const ev = rowEvents[i];
    if (!ev) return;

    const [y, m, d] = (ev.date || '').split('-').map(Number);
    const dateText = y
      ? `${WEEKDAYS[(new Date(y, m - 1, d).getDay() + 6) % 7]} ${ordinal(d)} ${MONTHS[m - 1]} ${y}`
      : '';

    $('cm-box').style.setProperty('--c', safeHex(ev.colorHex));
    $('cm-color').textContent = ev.colorName || '';
    $('cm-ref').textContent =
      (ev.refs && ev.refs.length) ? refsText(ev.refs)
      : ev.number ? `${ev.kind} ${ev.number}` : 'No PP / OS';
    $('cm-when').textContent = [dateText, timeLabel(ev)].filter(Boolean).join(' · ');
    $('cm-title').textContent = ev.title || '';

    $('cm-loc-block').classList.toggle('hidden', !ev.location);
    $('cm-loc').textContent = ev.location || '';
    $('cm-map').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(ev.location || '');

    const desc = descriptionText(ev.description);
    $('cm-desc-block').classList.toggle('hidden', !desc);
    $('cm-desc').innerHTML = linkify(escapeHtml(desc));

    $('card-modal').classList.remove('hidden');

  }


  function closeModals() {
    document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden'));
  }


  // =========================================
  // ANSWERS (admin)
  // =========================================

  let answersCache = [];

  async function openAnswers() {

    if (!sheetSaved) return;

    try {

      await reloadCurrent(true);   // latest durations from everybody
      answersCache = await api(`/api/sheets/${currentId}/responses`);

    } catch (err) {

      setStatus('Could not load answers: ' + err.message, 'err');
      return;

    }

    const rows = [];

    for (let i = 0; i < ROWS; i++) {
      const key = rowKey(i);
      if (!key) continue;
      rows.push({ i, key });
    }

    const d = sheetIsoDate();
    const answered = rows.filter(r => rowDur[r.i] && rowDur[r.i].duration).length;

    $('ans-sub').textContent =
      `${d ? d.split('-').reverse().join('/') : ''} · ${currentRoute || 'no route'} · ` +
      `${answered} of ${rows.length} deliveries with duration · ${answersCache.length} answer${answersCache.length === 1 ? '' : 's'}` +
      (sheetStatus === 'closed' ? ` · closed by ${sheetInfo.closedBy}` : ' · day still open');

    $('ans-body').innerHTML = rows.map(({ i, key }) => {

      const ev = rowEvents[i];
      const title = ev ? `${timeLabel(ev)} · ${ev.title}` : rowRefText({ kind: field(i, 'kind').value, number: field(i, 'number').value.trim(), event: null });
      const dur = rowDur[i];
      const hist = answersCache.filter(a => a.key === key);

      return `
        <div class="ans-item">
          <div class="ans-head">
            <strong>${escapeHtml(title)}</strong>
            ${dur && dur.duration
              ? `<span class="ans-final">${escapeHtml(durationLabel(dur.duration))}</span>`
              : '<span class="ans-final none">No duration</span>'}
          </div>
          ${hist.length ? `<ul class="ans-hist">${hist.map(a => `
            <li>${escapeHtml(shortTime(a.at))} · ${escapeHtml(a.name)}${a.admin ? ' (admin)' : ''} → ${a.minutes ? escapeHtml(durationLabel(a.minutes)) : 'cleared'}</li>`).join('')}
          </ul>` : ''}
        </div>`;

    }).join('') || '<p class="answers-sub">No deliveries on this sheet.</p>';

    $('answers-modal').classList.remove('hidden');

  }


  function downloadCsv() {

    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const date = sheetIsoDate();

    const lines = [['Date', 'Route', 'Delivery', 'PP / OS', 'Final duration (min)', 'Answer by', 'Answer (min)', 'Answered at'].map(q).join(',')];

    for (let i = 0; i < ROWS; i++) {

      const key = rowKey(i);
      if (!key) continue;

      const ev = rowEvents[i];
      const ref = rowRefText({ kind: field(i, 'kind').value, number: field(i, 'number').value.trim(), event: ev });
      const title = ev ? ev.title : '';
      const final = rowDur[i] && rowDur[i].duration ? rowDur[i].duration : '';
      const hist = answersCache.filter(a => a.key === key);

      if (!hist.length) {
        lines.push([date, currentRoute, title, ref, final, '', '', ''].map(q).join(','));
      }

      for (const a of hist) {
        lines.push([date, currentRoute, title, ref, final, a.name, a.minutes ?? '', new Date(a.at).toLocaleString('en-GB')].map(q).join(','));
      }

    }

    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `durations-${date || 'sheet'}-${(currentRoute || 'route').toLowerCase().replace(/\s+/g, '-')}.csv`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

  }


  // =========================================
  // CALENDAR LOAD (admin)
  // =========================================

  async function loadCalendar() {

    if (!isAdmin) return;

    calDate = sheetIsoDate();

    if (!calDate) {
      dayEvents = [];
      routes = [];
      renderRoute();
      for (let i = 0; i < ROWS; i++) linkRow(i);
      renderRows();
      return;
    }

    const asked = calDate;

    try {

      const data = await api('/api/calendar?date=' + asked);

      if (asked !== calDate) return;   // date changed meanwhile

      calColor = data.calendarColor || '';
      syncedAt = data.syncedAt || null;
      dayEvents = (data.events || []).filter(ev => !isIgnored(ev)).map(prepareEvent);

      buildRoutes();

      // no route chosen yet -> guess it from the rows already on the sheet
      if (!currentRoute) {
        const linked = rowEvents.find(Boolean);
        if (linked && routes.some(r => r.name === linked.colorName)) currentRoute = linked.colorName;
      }

      // closed sheets keep exactly what was saved
      if (sheetStatus !== 'closed') {
        for (let i = 0; i < ROWS; i++) linkRow(i);
      }

      renderRoute();
      renderRows();

    } catch (err) {

      setStatus('Could not load calendar events', 'err');

    }

  }


  // =========================================
  // READ / WRITE FORM
  // =========================================

  function readForm() {

    const rows = [];

    for (let i = 0; i < ROWS; i++) {
      rows.push({
        key: rowKey(i),
        kind: field(i, 'kind').value,
        number: field(i, 'number').value.trim(),
        event: rowEvents[i]
      });
    }

    const d = $('date-day').value;
    const m = $('date-month').value;
    const y = $('date-year').value;

    return {
      date: {
        day: d,
        month: m,
        year: y,
        text: (d && m && y) ? `${ordinal(Number(d))} ${MONTHS[m - 1]} ${y}` : ''
      },
      day: $('weekday').value,
      route: currentRoute,
      routeHex: currentRoute ? routeHex : '',
      rows,
      signOut: $('sign-out').value.trim(),
      signIn: $('sign-in').value.trim()
    };

  }


  function writeForm(sheet) {

    const date = sheet.date || {};

    $('date-year').value = date.year || String(YEARS[0]);
    $('date-month').value = date.month || '';
    refreshDays();
    $('date-day').value = date.day || '';

    $('weekday').value = sheet.day || '';

    $('ro-date').textContent = date.text || '—';
    $('ro-day').textContent = sheet.day || '—';

    currentRoute = sheet.route || '';
    routeHex = sheet.routeHex || '';

    sheetStatus = sheet.status || 'open';
    sheetInfo = { closedBy: sheet.closedBy, closedAt: sheet.closedAt, updatedAt: sheet.updatedAt };

    const rows = sheet.rows || [];

    savedKeys = new Set();

    for (let i = 0; i < ROWS; i++) {
      const row = rows[i] || {};
      field(i, 'kind').value = row.kind || 'PP';
      field(i, 'number').value = row.number || '';
      rowEvents[i] = row.event || null;
      manualMode[i] = !!row.number && !row.event;
      rowDur[i] = row.duration || row.durationBy
        ? { duration: row.duration, durationBy: row.durationBy, durationAt: row.durationAt }
        : null;
      justSaved[i] = false;
      if (row.key) savedKeys.add(row.key);
    }

    $('sign-out').value = sheet.signOut || '';
    $('sign-in').value = sheet.signIn || '';

    renderRoute();
    renderRows();
    renderList();

  }


  // Only durations / status from the server (keeps the admin's unsaved edits)
  function mergeDurations(sheet) {

    sheetStatus = sheet.status || 'open';
    sheetInfo = { closedBy: sheet.closedBy, closedAt: sheet.closedAt, updatedAt: sheet.updatedAt };

    const byKey = {};
    for (const r of (sheet.rows || [])) if (r.key) byKey[r.key] = r;

    for (let i = 0; i < ROWS; i++) {
      const r = byKey[rowKey(i)];
      if (r && (r.duration || r.durationBy)) {
        rowDur[i] = { duration: r.duration, durationBy: r.durationBy, durationAt: r.durationAt };
      }
    }

    renderRows();

  }


  // =========================================
  // API
  // =========================================

  async function api(path, options = {}) {

    const headers = {
      'content-type': 'application/json',
      'x-user-name': encodeURIComponent(userName),
      ...(options.headers || {})
    };

    if (adminToken) headers['x-admin-token'] = adminToken;

    const res = await fetch(path, { ...options, headers });

    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);

    return res.json();

  }


  function renderList() {

    $('saved-count').textContent = sheetList.length;

    $('saved-list').innerHTML = sheetList.map(s => {

      const done = s.deliveries && s.answered === s.deliveries;
      const pill = s.status === 'closed'
        ? '<span class="pill closed">Closed</span>'
        : `<span class="pill ${done ? 'done' : ''}">${s.answered || 0}/${s.deliveries || 0} durations</span>`;

      return `
        <li class="${s.id === currentId && sheetSaved ? 'current' : ''}">
          <span class="info">
            <strong>${escapeHtml(s.date?.text || 'No date')}</strong>
            ${s.day ? '· ' + escapeHtml(s.day) : ''}
            ${s.route ? `· <span class="dot" style="--c:${safeHex(s.routeHex)}"></span> ${escapeHtml(s.route)}` : ''}
            ${pill}
            <br><small>Last saved by ${escapeHtml(s.updatedBy)} · ${new Date(s.updatedAt).toLocaleString('en-GB')}</small>
          </span>
          <button type="button" data-open="${escapeHtml(s.id)}">Open</button>
          ${isAdmin ? `<button type="button" class="danger" data-delete="${escapeHtml(s.id)}">Delete</button>` : ''}
        </li>`;

    }).join('') || '<li><span class="info"><small>No sheets yet.</small></span></li>';

  }


  async function loadList() {

    try {

      sheetList = await api('/api/sheets');
      renderList();

    } catch (err) {

      setStatus('Could not load list', 'err');

    }

  }


  async function save() {

    if (!isAdmin) return;

    setStatus('Saving…');

    try {

      const sheet = await api('/api/sheets/' + currentId, {
        method: 'PUT',
        body: JSON.stringify(readForm())
      });

      sheetSaved = true;
      savedKeys = new Set((sheet.rows || []).map(r => r.key).filter(Boolean));
      mergeDurations(sheet);

      setStatus('Saved ' + new Date().toLocaleTimeString('en-GB'), 'ok');

      loadList();

    } catch (err) {

      setStatus('Save failed: ' + err.message, 'err');

    }

  }


  async function openSheet(id) {

    try {

      const sheet = await api('/api/sheets/' + id);

      currentId = sheet.id;
      sheetSaved = true;

      writeForm(sheet);

      loadCalendar();

      setStatus(isAdmin ? 'Opened' : '', 'ok');

      if (!isAdmin) $('saved-box').open = false;

      window.scrollTo({ top: 0, behavior: 'smooth' });

    } catch (err) {

      setStatus('Open failed', 'err');

    }

  }


  // reload the sheet from the server (team: all of it; admin: durations + status)
  async function reloadCurrent(quiet) {

    if (!sheetSaved) return;

    try {

      const sheet = await api('/api/sheets/' + currentId);

      if (isAdmin) mergeDurations(sheet);
      else writeForm(sheet);

      if (!quiet) setStatus('Updated ' + new Date().toLocaleTimeString('en-GB'), 'ok');

    } catch (err) {

      if (!quiet) setStatus('Could not refresh', 'err');

    }

  }


  async function deleteSheet(id) {

    if (!confirm('Delete this sheet and all its duration answers?')) return;

    try {

      await api('/api/sheets/' + id, { method: 'DELETE' });

      if (id === currentId) newSheet();

      loadList();

    } catch (err) {

      setStatus('Delete failed: ' + err.message, 'err');

    }

  }


  async function toggleClose() {

    if (!sheetSaved) return;

    const closing = sheetStatus !== 'closed';

    if (closing && !confirm('Close this day? Nobody will be able to change the durations after that (you can reopen it).')) return;

    try {

      const sheet = await api(`/api/sheets/${currentId}/${closing ? 'close' : 'reopen'}`, { method: 'POST' });

      mergeDurations(sheet);

      setStatus(closing ? 'Day closed' : 'Day reopened', 'ok');

      loadList();

      if (closing) openAnswers();

    } catch (err) {

      setStatus('Failed: ' + err.message, 'err');

    }

  }


  function newSheet() {

    currentId = newId();
    sheetSaved = false;
    sheetStatus = 'open';
    sheetInfo = {};

    writeForm({});

    loadCalendar();

    setStatus('');

  }


  // team member: open today's sheet by itself when there is only one
  function autoOpen() {

    if (isAdmin || sheetSaved) return;

    const today = todayIso();
    const open = sheetList.filter(s => s.status !== 'closed' && listIso(s) === today);

    if (open.length === 1) {
      openSheet(open[0].id);
    } else {
      $('saved-box').open = true;
    }

  }


  // =========================================
  // NAME GATE
  // =========================================

  function showGate() {

    $('gate').classList.remove('hidden');
    $('gate-name').value = userName;
    $('gate-admin').checked = !!adminToken;
    $('gate-pass').value = '';
    $('gate-pass').classList.add('hidden');
    $('gate-error').classList.add('hidden');
    $('gate-name').focus();

  }


  async function enter(name, wantsAdmin, password) {

    userName = name;
    safeSet(NAME_KEY, name);

    const showError = msg => {
      $('gate-error').textContent = msg;
      $('gate-error').classList.remove('hidden');
    };

    if (!wantsAdmin) {
      adminToken = '';
    } else if (password) {
      try {
        const res = await api('/api/admin/login', {
          method: 'POST',
          body: JSON.stringify({ password })
        });
        adminToken = res.token;
      } catch (err) {
        showError(err.message);
        return;
      }
    } else if (!adminToken) {
      showError('Type the admin password');
      $('gate-pass').classList.remove('hidden');
      $('gate-pass').focus();
      return;
    }

    // check the saved token is still valid
    try {
      const me = await api('/api/me');
      if (wantsAdmin && !me.admin) {
        adminToken = '';
        safeSet(TOKEN_KEY, '');
        showError('Admin session expired – type the password again');
        $('gate-pass').classList.remove('hidden');
        $('gate-pass').focus();
        return;
      }
      isAdmin = !!me.admin;
    } catch (err) {
      showError('Could not connect: ' + err.message);
      return;
    }

    safeSet(TOKEN_KEY, adminToken);

    $('who').textContent = name;
    $('gate').classList.add('hidden');

    applyRole();
    renderRows();

    try { await api('/api/hello', { method: 'POST' }); } catch {}

    await loadList();

    if (isAdmin && sheetIsoDate()) loadCalendar();

    autoOpen();

  }


  // =========================================
  // EVENTS
  // =========================================

  $('gate').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('gate-name').value.trim();
    if (name) enter(name, $('gate-admin').checked, $('gate-pass').value);
  });

  $('gate-admin').addEventListener('change', () => {
    const show = $('gate-admin').checked && !adminToken;
    $('gate-pass').classList.toggle('hidden', !show);
    if (show) $('gate-pass').focus();
  });

  $('change-user').addEventListener('click', showGate);

  function onDateChange() {
    currentRoute = '';
    loadCalendar();
  }

  $('date-month').addEventListener('change', () => { refreshDays(); suggestWeekday(); onDateChange(); });
  $('date-year').addEventListener('change', () => { refreshDays(); suggestWeekday(); onDateChange(); });
  $('date-day').addEventListener('change', () => { suggestWeekday(); onDateChange(); });

  $('route').addEventListener('change', () => {
    currentRoute = $('route').value;
    renderRoute();
    renderRows();
  });

  $('route-fill').addEventListener('click', fillRoute);
  $('route-refresh').addEventListener('click', loadCalendar);

  $('btn-save').addEventListener('click', save);
  $('btn-new').addEventListener('click', () => {
    if (confirm('Start a new blank sheet? Unsaved changes will be lost.')) newSheet();
  });
  $('btn-answers').addEventListener('click', openAnswers);
  $('btn-close').addEventListener('click', toggleClose);
  $('btn-reload').addEventListener('click', () => { loadList(); reloadCurrent(false); });
  $('btn-print').addEventListener('click', () => window.print());

  $('ans-csv').addEventListener('click', downloadCsv);

  $('saved-list').addEventListener('click', e => {
    const open = e.target.closest('[data-open]');
    const del = e.target.closest('[data-delete]');
    if (open) openSheet(open.dataset.open);
    if (del) deleteSheet(del.dataset.delete);
  });

  // rows
  $('rows').addEventListener('change', e => {
    const t = e.target;
    const i = Number(t.dataset.row);
    if (t.dataset.field === 'pick') onPick(i);
    else if (t.dataset.field === 'duration') onDuration(i);
    else if (t.dataset.field === 'kind' || t.dataset.field === 'number') {
      resetRowDuration(i);
      linkRow(i);
      // number typed by hand exists in the calendar -> show it as a normal option
      if (findEvent(field(i, 'kind').value, field(i, 'number').value.trim())) manualMode[i] = false;
      renderRows();
    }
  });

  // typing a number by hand: update the card as you type
  $('rows').addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.field !== 'number') return;
    const i = Number(t.dataset.row);
    linkRow(i);
    renderCardCell(i);
  });

  $('rows').addEventListener('click', e => {
    const card = e.target.closest('[data-card]');
    if (card) openCard(Number(card.dataset.card));
  });

  // modals
  document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => {
      if (e.target === m || e.target.closest('[data-close]')) closeModals();
    });
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

  // =========================================
  // INIT
  // =========================================

  buildHeader();
  buildRows();
  renderRoute();
  applyRole();

  // Name is asked on every page load (pre-filled with the last one used)
  showGate();

})();
</script>
</body>
</html>
