        <li class="${s.id === currentId && sheetSaved ? 'current' : ''}">
          <span class="info">
            <strong>${escapeHtml(s.date?.text || 'No date')}</strong>
            ${s.day ? '· ' + escapeHtml(s.day) : ''}
            ${s.route ? `· <span class="dot" style="--c:${safeHex(s.routeHex)}"></span> ${escapeHtml(s.route)}` : ''}
            ${pill}${flagPill}
            <br><small>Last saved by ${escapeHtml(s.updatedBy)} · ${new Date(s.updatedAt).toLocaleString('en-GB')}</small>
          </span>
          <button type="button" data-open="${escapeHtml(s.id)}">Open</button>
          ${isAdmin ? `<button type="button" class="danger" data-delete="${escapeHtml(s.id)}">Delete</button>` : ''}
        </li>`;

    }).join('') || '<li><span class="info"><small>No sheets yet.</small></span></li>';

  }


  async function loadList() {

    try {

      sheetList = await api('/api/sheets');
      renderList();

    } catch (err) {

      setStatus('Could not load list', 'err');

    }

  }


  async function save() {

    if (!isAdmin) return;

    setStatus('Saving…');

    try {

      const sheet = await api('/api/sheets/' + currentId, {
        method: 'PUT',
        body: JSON.stringify(readForm())
      });

      sheetSaved = true;
      savedKeys = new Set((sheet.rows || []).map(r => r.key).filter(Boolean));
      mergeDurations(sheet);

      setStatus('Saved ' + new Date().toLocaleTimeString('en-GB'), 'ok');

      loadList();

    } catch (err) {

      setStatus('Save failed: ' + err.message, 'err');

    }

  }


  async function openSheet(id) {

    try {

      const sheet = await api('/api/sheets/' + id);

      currentId = sheet.id;
      sheetSaved = true;

      writeForm(sheet);

      loadCalendar();

      setStatus(isAdmin ? 'Opened' : '', 'ok');

      if (!isAdmin) $('saved-box').open = false;

      window.scrollTo({ top: 0, behavior: 'smooth' });

    } catch (err) {

      setStatus('Open failed', 'err');

    }

  }


  // reload the sheet from the server (team: all of it; admin: durations + status)
  async function reloadCurrent(quiet) {

    if (!sheetSaved) return;

    try {

      const sheet = await api('/api/sheets/' + currentId);

      if (isAdmin) mergeDurations(sheet);
      else writeForm(sheet);

      if (!quiet) setStatus('Updated ' + new Date().toLocaleTimeString('en-GB'), 'ok');

    } catch (err) {

      if (!quiet) setStatus('Could not refresh', 'err');

    }

  }


  async function deleteSheet(id) {

    if (!confirm('Delete this sheet and all its duration answers?')) return;

    try {

      await api('/api/sheets/' + id, { method: 'DELETE' });

      if (id === currentId) newSheet();

      loadList();

    } catch (err) {

      setStatus('Delete failed: ' + err.message, 'err');

    }

  }


  async function toggleClose() {

    if (!sheetSaved) return;

    const closing = sheetStatus !== 'closed';

    if (closing && !confirm('Close this day? Nobody will be able to change the durations after that (you can reopen it).')) return;

    try {

      const sheet = await api(`/api/sheets/${currentId}/${closing ? 'close' : 'reopen'}`, { method: 'POST' });

      mergeDurations(sheet);

      setStatus(closing ? 'Day closed' : 'Day reopened', 'ok');

      loadList();

      if (closing) openAnswers();

    } catch (err) {

      setStatus('Failed: ' + err.message, 'err');

    }

  }


  function newSheet() {

    currentId = newId();
    sheetSaved = false;
    sheetStatus = 'open';
    sheetInfo = {};

    writeForm({});

    loadCalendar();

    setStatus('');

  }


  // team member: open today's sheet by itself when there is only one
  function autoOpen() {

    if (isAdmin || sheetSaved) return;

    const today = todayIso();
    const open = sheetList.filter(s => s.status !== 'closed' && listIso(s) === today);

    if (open.length === 1) {
      openSheet(open[0].id);
    } else {
      $('saved-box').open = true;
    }

  }


  // =========================================
  // NAME GATE
  // =========================================

  function showGate() {

    $('gate').classList.remove('hidden');
    $('gate-name').value = userName;
    $('gate-admin').checked = !!adminToken;
    $('gate-pass').value = '';
    $('gate-pass').classList.add('hidden');
    $('gate-error').classList.add('hidden');
    $('gate-name').focus();

  }


  async function enter(name, wantsAdmin, password) {

    userName = name;
    safeSet(NAME_KEY, name);

    const showError = msg => {
      $('gate-error').textContent = msg;
      $('gate-error').classList.remove('hidden');
    };

    if (!wantsAdmin) {
      adminToken = '';
    } else if (password) {
      try {
        const res = await api('/api/admin/login', {
          method: 'POST',
          body: JSON.stringify({ password })
        });
        adminToken = res.token;
      } catch (err) {
        showError(err.message);
        return;
      }
    } else if (!adminToken) {
      showError('Type the admin password');
      $('gate-pass').classList.remove('hidden');
      $('gate-pass').focus();
      return;
    }

    // check the saved token is still valid
    try {
      const me = await api('/api/me');
      if (wantsAdmin && !me.admin) {
        adminToken = '';
        safeSet(TOKEN_KEY, '');
        showError('Admin session expired – type the password again');
        $('gate-pass').classList.remove('hidden');
        $('gate-pass').focus();
        return;
      }
      isAdmin = !!me.admin;
    } catch (err) {
      showError('Could not connect: ' + err.message);
      return;
    }

    safeSet(TOKEN_KEY, adminToken);

    $('who').textContent = name;
    $('gate').classList.add('hidden');

    applyRole();
    renderRows();

    try { await api('/api/hello', { method: 'POST' }); } catch {}

    await loadList();

    if (isAdmin && sheetIsoDate()) loadCalendar();

    autoOpen();

  }


  // =========================================
  // EVENTS
  // =========================================

  $('gate').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('gate-name').value.trim();
    if (name) enter(name, $('gate-admin').checked, $('gate-pass').value);
  });

  $('gate-admin').addEventListener('change', () => {
    const show = $('gate-admin').checked && !adminToken;
    $('gate-pass').classList.toggle('hidden', !show);
    if (show) $('gate-pass').focus();
  });

  $('change-user').addEventListener('click', showGate);

  function onDateChange() {
    currentRoute = '';
    loadCalendar();
  }

  $('date-month').addEventListener('change', () => { refreshDays(); suggestWeekday(); onDateChange(); });
  $('date-year').addEventListener('change', () => { refreshDays(); suggestWeekday(); onDateChange(); });
  $('date-day').addEventListener('change', () => { suggestWeekday(); onDateChange(); });

  $('route').addEventListener('change', () => {
    currentRoute = $('route').value;
    renderRoute();
    renderRows();
  });

  $('route-fill').addEventListener('click', fillRoute);
  $('route-refresh').addEventListener('click', loadCalendar);

  $('btn-save').addEventListener('click', save);
  $('btn-new').addEventListener('click', () => {
    if (confirm('Start a new blank sheet? Unsaved changes will be lost.')) newSheet();
  });
  $('btn-answers').addEventListener('click', openAnswers);
  $('btn-close').addEventListener('click', toggleClose);
  $('btn-reload').addEventListener('click', () => { loadList(); reloadCurrent(false); });
  $('btn-print').addEventListener('click', () => window.print());

  $('ans-csv').addEventListener('click', downloadCsv);

  $('saved-list').addEventListener('click', e => {
    const open = e.target.closest('[data-open]');
    const del = e.target.closest('[data-delete]');
    if (open) openSheet(open.dataset.open);
    if (del) deleteSheet(del.dataset.delete);
  });

  // rows
  $('rows').addEventListener('change', e => {
    const t = e.target;
    const i = Number(t.dataset.row);
    if (t.dataset.field === 'pick') onPick(i);
    else if (t.dataset.field === 'duration') onDuration(i);
    else if (t.dataset.field === 'kind' || t.dataset.field === 'number') {
      resetRowDuration(i);
      linkRow(i);
      // number typed by hand exists in the calendar -> show it as a normal option
      if (findEvent(field(i, 'kind').value, field(i, 'number').value.trim())) manualMode[i] = false;
      renderRows();
    }
  });

  // typing a number by hand: update the card as you type
  $('rows').addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.field !== 'number') return;
    const i = Number(t.dataset.row);
    linkRow(i);
    renderCardCell(i);
  });

  $('pv-list').addEventListener('click', e => {
    const b = e.target.closest('[data-pv]');
    if (b) openCardEv(previewEvents[Number(b.dataset.pv)]);
  });

  $('preview').addEventListener('toggle', () => {
    if ($('preview').open && map) setTimeout(() => map.invalidateSize(), 50);
  });

  $('rows').addEventListener('click', e => {
    const card = e.target.closest('[data-card]');
    if (card) openCard(Number(card.dataset.card));
  });

  // modals
  document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => {
      if (e.target === m || e.target.closest('[data-close]')) closeModals();
    });
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

  // =========================================
  // INIT
  // =========================================

  buildHeader();
  buildRows();
  renderRoute();
  applyRole();

  // Name is asked on every page load (pre-filled with the last one used)
  showGate();

})();
</script>
</body>
